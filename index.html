function calcBMI(weight, heightStr) {
  if (!heightStr) return null;
  // parse height like "5'11" or "71" (inches) or "180cm"
  let inches = null;
  const ftIn = heightStr.match(/(\d+)'(\d+)/);
  const ftOnly = heightStr.match(/^(\d+)'$/);
  const inOnly = heightStr.match(/^(\d+)"?$/);
  const cm = heightStr.match(/(\d+)\s*cm/i);
  if (ftIn) inches = parseInt(ftIn[1]) * 12 + parseInt(ftIn[2]);
  else if (ftOnly) inches = parseInt(ftOnly[1]) * 12;
  else if (cm) inches = parseFloat(cm[1]) / 2.54;
  else if (inOnly) inches = parseInt(inOnly[1]);
  if (!inches) return null;
  return ((weight / (inches * inches)) * 703).toFixed(1);
}

function calcLean(weight, fatPct) {
  if (!fatPct) return null;
  return (weight * (1 - fatPct / 100)).toFixed(1);
}

function renderBWGraph(entries) {
  if (entries.length < 2) return `<div style="padding:20px;text-align:center;color:#444;font-size:11px">Log at least 2 entries to see graphs.</div>`;

  const heightStr = (settings && settings.height) ? settings.height : "";
  const metrics = {
    weight: { label: "Weight (lbs)", color: "#a78bfa", vals: entries.map(e => parseFloat(e.weight)) },
    fat:    { label: "Body Fat %",   color: "#f5a05a", vals: entries.map(e => e.fat ? parseFloat(e.fat) : null) },
    lean:   { label: "Lean Mass (lbs)", color: "#4ade80", vals: entries.map(e => (e.fat && e.weight) ? parseFloat(calcLean(e.weight, e.fat)) : null) },
    bmi:    { label: "BMI",          color: "#5ab4f5", vals: entries.map(e => heightStr ? parseFloat(calcBMI(e.weight, heightStr)) : null) },
  };

  // Filter to last 30 entries max
  const slice = entries.slice(-30);
  const metric = metrics[bwGraphMetric];
  const vals = metric.vals.slice(-30);

  // Check we have enough real values
  const realVals = vals.filter(v => v !== null && !isNaN(v));
  if (realVals.length < 2) {
    let msg = "No data for this metric.";
    if (bwGraphMetric === "fat" || bwGraphMetric === "lean") msg = "Log body fat % to see this graph.";
    if (bwGraphMetric === "bmi") msg = heightStr ? "Not enough data." : "Add your height in Settings to see BMI.";
    return `<div style="padding:20px;text-align:center;color:#444;font-size:11px">${msg}</div>`;
  }

  const W = 320, H = 120, PL = 36, PR = 10, PT = 10, PB = 24;
  const gW = W - PL - PR, gH = H - PT - PB;
  const mn = Math.min(...realVals), mx = Math.max(...realVals);
  const range = mx - mn || 1;

  const points = slice.map((e, i) => {
    const v = vals[i];
    if (v === null || isNaN(v)) return null;
    const x = PL + (i / (slice.length - 1)) * gW;
    const y = PT + (1 - (v - mn) / range) * gH;
    return { x, y, v, date: e.date };
  });

  // SVG path from non-null points
  const validPts = points.filter(Boolean);
  const pathD = validPts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

  // Y axis labels
  const yLabels = [mn, (mn + mx) / 2, mx].map((v, i) => {
    const y = PT + (1 - (v - mn) / range) * gH;
    return `<text class="svg-axis-label" x="${PL - 4}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle">${v.toFixed(1)}</text>`;
  }).join("");

  // X axis labels (first, mid, last)
  const xIdxs = [0, Math.floor((slice.length - 1) / 2), slice.length - 1];
  const xLabels = xIdxs.map(i => {
    const x = PL + (i / (slice.length - 1)) * gW;
    return `<text class="svg-axis-label" x="${x.toFixed(1)}" y="${H - 4}" text-anchor="middle">${escH(slice[i] ? fmtDate(slice[i].date) : "")}</text>`;
  }).join("");

  // Dots with tooltip via title
  const dots = validPts.map(p =>
    `<circle class="svg-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${metric.color}" opacity="0.9">
      <title>${escH(fmtDate(p.date))}: ${p.v.toFixed(1)}</title>
    </circle>`
  ).join("");

  // Gradient fill under line
  const fillD = pathD + ` L${validPts[validPts.length-1].x.toFixed(1)},${(PT+gH).toFixed(1)} L${validPts[0].x.toFixed(1)},${(PT+gH).toFixed(1)} Z`;

  const svgId = "bw-svg-" + bwGraphMetric;
  return `
    <svg class="bw-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bwgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${metric.color}" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="${metric.color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- grid lines -->
      <line x1="${PL}" y1="${PT}" x2="${PL+gW}" y2="${PT}" stroke="#222" stroke-width="0.5"/>
      <line x1="${PL}" y1="${PT+gH/2}" x2="${PL+gW}" y2="${PT+gH/2}" stroke="#222" stroke-width="0.5"/>
      <line x1="${PL}" y1="${PT+gH}" x2="${PL+gW}" y2="${PT+gH}" stroke="#222" stroke-width="0.5"/>
      <!-- fill -->
      <path d="${fillD}" fill="url(#bwgrad)"/>
      <!-- line -->
      <path class="svg-line" d="${pathD}" stroke="${metric.color}"/>
      <!-- dots -->
      ${dots}
      <!-- labels -->
      ${yLabels}
      ${xLabels}
    </svg>`;
}

function renderBW() {
  const rawEntries = Array.isArray(data["BODY"]) ? data["BODY"] : [];
  const entries = sortedEntries(rawEntries);

  const heightStr = (settings && settings.height) ? settings.height : "";

  const totalChg = (latest && first) ? (latest.weight - first.weight).toFixed(1) : null;
  const last7 = entries.slice(-7);

      ${latest && latest.fat ? `<div class="bw-stat">

  const graphHtml = bwGraphOpen ? `

  // ── History ──
  const chartEntries = entries.slice(-14);
  const histRows = bwHistOpen ? (entries.length ? entries.slice().reverse().map((e,i)=>{
    const prev = entries[entries.length-2-i];
    const diff = prev ? (e.weight-prev.weight).toFixed(1) : null;

    const ds = diff!==null ? `<span class="bw-delta ${cls}">${parseFloat(diff)>0?"+":""}${diff}</span>` : "";
    const bmi = calcBMI(e.weight, heightStr);

    return `<div class="bw-erow ${i===0?"latest":""}">
      <span>${escH(fmtDate(e.date))}</span>

      ${e.fat ? `<span>${e.fat}% fat</span>` : "<span></span>"}
      ${lean ? `<span>${lean} lbs lean</span>` : "<span></span>"}
      ${bmi ? `<span>BMI ${bmi}</span>` : "<span></span>"}

  // ── JSON Paste section — clipboard button ──

            ${pickerSearch ? `<button class="picker-search-x" onclick="pickerSearch='';renderPickerOnly()" style="display:flex;align-items:center"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ""}
          </div>
          <div class="picker-muscles">
            ${MUSCLE_GROUPS.map(m => `
              <button class="pmuscle ${m===pickerMuscle?"active":""}" onclick="pickerMuscle='${escQ(m)}';renderPickerOnly()">${escH(m)}</button>
            `).join("")}
          </div>
        </div>
        <div class="picker-day-strip">
          <span style="font-size:9px;color:#444;letter-spacing:1px;align-self:center;padding-right:6px;flex-shrink:0">ADD TO:</span>
          ${WORKOUT_DAYS.map(d => `
            <button class="pday ${pickerDays.has(d)?"active":""}" onclick="togglePickerDay('${escQ(d)}')">${escH(d)}</button>
          `).join("")}
        </div>
        <div class="picker-list" id="picker-list">
          ${emptyHtml}${listHtml}
        </div>
        <div class="picker-custom">
          <div class="picker-custom-label">CUSTOM EXERCISE</div>
          <div class="picker-custom-row">
            <input class="picker-custom-input" id="picker-custom-name" placeholder="e.g. Sissy Squat Machine"
              autocorrect="off" spellcheck="false">
            <button class="picker-custom-btn" onclick="submitCustomEx()">ADD</button>
          </div>
        </div>
      </div>
    </div>`;
}

// Re-render only the picker contents without rebuilding the whole page
// (keeps keyboard open on mobile during search)
function renderPickerOnly() {
  const existing = new Set([...pickerDays].flatMap(d => Object.keys(data[d] || {})));
  const q = pickerSearch.trim().toLowerCase();
  let items = EXERCISE_LIBRARY;
  if (pickerMuscle !== "ALL") items = items.filter(e => e.muscle === pickerMuscle);
  if (q) items = items.filter(e => e.name.toLowerCase().includes(q) || e.muscle.toLowerCase().includes(q));

  // Update muscle filter buttons
  document.querySelectorAll(".pmuscle").forEach(btn => {
    btn.className = "pmuscle" + (btn.textContent === pickerMuscle ? " active" : "");
  });
  // Update day buttons
  document.querySelectorAll(".pday").forEach(btn => {
    const onclick = btn.getAttribute("onclick") || "";
    const match = onclick.match(/togglePickerDay\('([^']+)'\)/);
    if (match) btn.className = "pday" + (pickerDays.has(match[1]) ? " active" : "");
  });

  const groups = {};
  for (const e of items) {
    if (!groups[e.muscle]) groups[e.muscle] = [];
    groups[e.muscle].push(e);
  }
  const listEl = document.getElementById("picker-list");
  if (!listEl) { render(); return; }

  const emptyHtml = items.length === 0
    ? `<div style="padding:32px 16px;text-align:center;color:#444;font-size:12px">No exercises found.<br><span style="color:#555;font-size:10px">Add it as custom below.</span></div>`
    : "";

  listEl.innerHTML = emptyHtml + Object.entries(groups).map(([muscle, exs]) => `
    <div class="picker-group">${escH(muscle.toUpperCase())}</div>
    ${exs.map(e => {
      const alreadyHas = existing.has(e.name);
      return `<div class="picker-item ${alreadyHas ? "used" : ""}" onclick="${alreadyHas ? "" : `pickExercise('${escQ(e.name)}')`}">
        <div>
          <div class="pi-name">${escH(e.name)}</div>
          <div class="pi-meta">${escH(e.muscle.toUpperCase())} · ${escH(e.tags.map(t=>t.split("·")[0].trim()).join(", "))}</div>
        </div>
        <div class="pi-add">${alreadyHas ? "✓" : "+"}</div>
      </div>`;
    }).join("")}
  `).join("");
}

function pickExercise(name) {
  for (const day of pickerDays) {
    if (!data[day]) data[day] = {};
    if (!data[day][name]) data[day][name] = [];
    const order = getExOrder(day);
    if (!order.includes(name)) order.push(name);
    saveExOrder(day, order);
  }
  save();
  // Mark as added without closing (let user keep picking)
  renderPickerOnly();
  // Brief flash confirmation
  const items = document.querySelectorAll(".picker-item");
  items.forEach(el => {
    if (el.querySelector(".pi-name") && el.querySelector(".pi-name").textContent === name) {
      el.style.background = "#1a2a0a";
      setTimeout(() => { el.style.background = ""; renderPickerOnly(); }, 600);
    }
  });
}

function submitCustomEx() {
  const input = document.getElementById("picker-custom-name");
  const name = (input ? input.value : "").trim();
  if (!name) return;
  for (const day of pickerDays) {
    if (!data[day]) data[day] = {};
    if (!data[day][name]) data[day][name] = [];
    const order = getExOrder(day);
    if (!order.includes(name)) order.push(name);
    saveExOrder(day, order);
  }
  save();
  if (input) input.value = "";
  renderPickerOnly();
}

function importBWFromClipboard() {
  const statusEl = document.getElementById("bw-paste-status");
  const setStatus = (msg, ok) => {
    if (!statusEl) return;
    statusEl.textContent = msg;
    statusEl.className = "bw-paste-status " + (ok ? "ok" : "err");
    statusEl.style.display = "block";
  };
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    setStatus("Clipboard not available — try a different browser.", false);
    return;
  }
  setStatus("Reading clipboard…", true);
  navigator.clipboard.readText().then(text => {
    if (!text.trim()) { setStatus("Clipboard is empty.", false); return; }
    submitBWPaste(text);
  }).catch(() => {
    setStatus("Clipboard permission denied — grant access and try again.", false);
  });
}

function submitBWPaste(raw) {
  if (raw === undefined) raw = (document.getElementById("bw-paste-input") || {}).value || "";
  const statusEl = document.getElementById("bw-paste-status");
  const setStatus = (msg, ok) => {
    if (!statusEl) return;
    statusEl.textContent = msg;
    statusEl.className = "bw-paste-status " + (ok ? "ok" : "err");
    statusEl.style.display = "block";
  };
  if (!raw.trim()) { setStatus("Nothing to import.", false); return; }

  let parsed;
  try { parsed = JSON.parse(raw.trim()); }
  catch(e) { setStatus("Invalid JSON — check your format.", false); return; }

  const arr = Array.isArray(parsed) ? parsed : [parsed];
  if (!arr.length) { setStatus("Empty array.", false); return; }

  let added = 0, skipped = 0;
  if (!Array.isArray(data["BODY"])) data["BODY"] = [];

  for (const item of arr) {
    const w = parseFloat(item.weight || item.Weight);
    let f = parseFloat(item.bodyFat || item.body_fat || item.bodyFatPercentage || item.fatPercent);
    let d = item.date || item.Date || item.timestamp || "";

    // If bodyFat is a ratio (0-1) not a percentage, convert it
    if (!isNaN(f) && f > 0 && f < 1) f = f * 100;
    // Round to 2 decimal places for display
    if (!isNaN(f)) f = Math.round(f * 100) / 100;

    // Normalise weight to 1 decimal
    const wRounded = Math.round(w * 10) / 10;

    // Normalise date formats → MM/DD/YYYY
    if (typeof d === "string") {
      if (d.match(/^\d{4}-\d{2}-\d{2}/)) {
        const parts = d.slice(0, 10).split("-");
        d = parts[1] + "/" + parts[2] + "/" + parts[0];
      } else if (d.match(/^[A-Za-z]+ \d/)) {
        const pd = new Date(d.replace(" at ", " "));
        if (!isNaN(pd)) d = String(pd.getMonth()+1).padStart(2,"0") + "/" + String(pd.getDate()).padStart(2,"0") + "/" + pd.getFullYear();
      } else if (d.match(/^\d{10,}/)) {
        const pd = new Date(parseInt(d) * (d.length === 10 ? 1000 : 1));
        if (!isNaN(pd)) d = String(pd.getMonth()+1).padStart(2,"0") + "/" + String(pd.getDate()).padStart(2,"0") + "/" + pd.getFullYear();
      }
    } else if (typeof d === "number") {
      const pd = new Date(d < 1e10 ? d * 1000 : d);
      if (!isNaN(pd)) d = String(pd.getMonth()+1).padStart(2,"0") + "/" + String(pd.getDate()).padStart(2,"0") + "/" + pd.getFullYear();
    }

    if (isNaN(wRounded) || wRounded <= 0) { skipped++; continue; }
    if (!d) d = today();

    // Avoid exact duplicates — use dateKey so format differences don't create dupes
    const dKey = dateKey(d);
    const dup = data["BODY"].find(e => dateKey(e.date) === dKey && e.weight === wRounded);
    if (dup) { skipped++; continue; }

    const entry = { date: d, weight: wRounded };
    if (!isNaN(f) && f > 0) entry.fat = f;
    data["BODY"].push(entry);
    added++;
  }

  if (added === 0) {
    setStatus(`Nothing new to add (${skipped} duplicate${skipped!==1?"s":""} skipped).`, false);
    return;
  }
  save();
  setStatus(`✓ Added ${added} entr${added!==1?"ies":"y"}${skipped ? ", " + skipped + " skipped" : ""}.`, true);
  setTimeout(() => { bwPasteOpen = false; render(); }, 1400);
}

function submitBW() {
  const dv=(document.getElementById("bw-date").value||today()).trim();
  const wv=parseFloat(document.getElementById("bw-weight").value);
  const fv=parseFloat(document.getElementById("bw-fat").value);
  const mv=parseFloat(document.getElementById("bw-muscle").value);
  const nv=document.getElementById("bw-note").value.trim();
  if(isNaN(wv)||wv<=0) return;
  if(!Array.isArray(data["BODY"])) data["BODY"]=[];
  data["BODY"].push({date:dv,weight:wv,...(!isNaN(fv)?{fat:fv}:{}),...(!isNaN(mv)?{muscle:mv}:{}),...(nv?{note:nv}:{})});
  save(); addingBW=false; bwHistOpen=true; render();
}

// ◆ RANGE SLIDER                                             · stats.js ◆ //
////////////////////////////////////////////////////////////////////////
// ── Range minimap drag ───────────────────────────────────────
let _rangeDragging = null; // "start" | "end" | "window"
let _rangeDragAnchor = null; // { rs, re, fx } for window drag

function _svgFrac(e) {
  const svg = document.getElementById("rsvg");
  if (!svg) return null;
  const rect = svg.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : (e.clientX ?? 0);
  return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
}

function minimapClick(e) {
  const frac = _svgFrac(e);
  if (frac === null) return;
  const rs = statsRangeStart ?? 0;
  const re = statsRangeEnd   ?? 1;
  const margin = 0.04;
  if (frac > rs + margin && frac < re - margin) {
    e.preventDefault(); e.stopPropagation();
    _rangeDragging = "window";
    _rangeDragAnchor = { rs, re, fx: frac };
    _attachRangeMoveUp();
  }
}

function startRangeDrag(e, handle) {
  e.preventDefault(); e.stopPropagation();
  _rangeDragging = handle;
  _rangeDragAnchor = null;
  _attachRangeMoveUp();
}

function _attachRangeMoveUp() {
  const move = e => {
    if (!_rangeDragging) return;
    if (e.cancelable) e.preventDefault();
    const rawFrac = _svgFrac(e);
    if (rawFrac === null) return;

    if (_rangeDragging === "start") {
      statsRangeStart = Math.max(0, Math.min(rawFrac, (statsRangeEnd ?? 1) - 0.02));
    } else if (_rangeDragging === "end") {
      statsRangeEnd = Math.min(1, Math.max(rawFrac, (statsRangeStart ?? 0) + 0.02));
    } else if (_rangeDragging === "window" && _rangeDragAnchor) {
      const { rs, re, fx } = _rangeDragAnchor;
      const span = re - rs;
      const delta = rawFrac - fx;
      statsRangeStart = Math.max(0, Math.min(rs + delta, 1 - span));
      statsRangeEnd   = statsRangeStart + span;
    }
    statsActiveDate = null;
    _updateRangeSVG();
  };
  const up = () => {
    _rangeDragging = null;
    _rangeDragAnchor = null;
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("touchmove", move);
    document.removeEventListener("touchend", up);
    render();
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
  document.addEventListener("touchmove", move, { passive: false });
  document.addEventListener("touchend", up);
}

function _updateRangeSVG() {
  const W = 420, H = 36, HANDLE_W = 14, HIT_W = 44;
  const rs = statsRangeStart ?? 0;
  const re = statsRangeEnd   ?? 1;
  const lx = rs * W, rx = re * W;

  function sa(id, attrs) {
    const el = document.getElementById(id);
    if (el) Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  }

  // Dimmers
  sa("mm-diml", { width: Math.max(0, lx).toFixed(1) });
  sa("mm-dimr", { x: rx.toFixed(1), width: Math.max(0, W-rx).toFixed(1) });
  // Selection overlay
  sa("mm-sel",  { x: lx.toFixed(1), width: Math.max(0, rx-lx).toFixed(1) });
  // Edge lines
  sa("mm-el",   { x1: lx.toFixed(1), x2: lx.toFixed(1) });
  sa("mm-er",   { x1: rx.toFixed(1), x2: rx.toFixed(1) });
  // Left handle visual
  sa("mm-hl",   { x: (lx - HANDLE_W/2).toFixed(1) });
  sa("mm-hll",  { x1: lx.toFixed(1), x2: lx.toFixed(1), y1: (H/2-4).toFixed(1), y2: (H/2+4).toFixed(1) });
  // Right handle visual
  sa("mm-hr",   { x: (rx - HANDLE_W/2).toFixed(1) });
  sa("mm-hrl",  { x1: rx.toFixed(1), x2: rx.toFixed(1), y1: (H/2-4).toFixed(1), y2: (H/2+4).toFixed(1) });
  // Update hit area x positions and tick colors in one pass
  const svg = document.getElementById("rsvg");
  if (svg) {
    const hitRects = [...svg.querySelectorAll("rect[fill='transparent']")];
    if (hitRects[0]) hitRects[0].setAttribute("x", (lx - HIT_W/2).toFixed(1));
    if (hitRects[1]) hitRects[1].setAttribute("x", (rx - HIT_W/2).toFixed(1));

    const maxBarH = H - 4;
    svg.querySelectorAll("line[id^='tick-']").forEach(line => {
      const x = parseFloat(line.getAttribute("x1"));
      const inside = x >= lx && x <= rx;
      // Recover original full height from the current y values to preserve volume scaling
      // We store the full-height y1 as a data attr on first render
      const origY1 = parseFloat(line.dataset.y1 ?? line.getAttribute("y1"));
      const origY2 = parseFloat(line.dataset.y2 ?? line.getAttribute("y2"));
      if (!line.dataset.y1) { line.dataset.y1 = origY1; line.dataset.y2 = origY2; }
      if (inside) {
        line.setAttribute("y1", origY1);
        line.setAttribute("y2", origY2);
        line.setAttribute("stroke", "#5ab4f5");
      } else {
        const fullH = origY2 - origY1;
        const dimH  = Math.max(2, Math.round(fullH * 0.45));
        line.setAttribute("y1", (H - 2 - dimH).toFixed(0));
        line.setAttribute("y2", (H - 2).toFixed(1));
        line.setAttribute("stroke", "#252525");
      }
    });
  }

  // Live date labels — only show when handle is near a tick
  if (window._mmSessions && window._mmAdjDays) {
    function labelForFrac(frac) {
      const days = window._mmAdjDays;
      const tMin = window._mmTMin, tRng = window._mmTRng;
      const t = tMin + frac * tRng;

      let bestIdx = 0, bestDist = Infinity;
      days.forEach((d, i) => {
        const dist = Math.abs(d - t);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
      });

      // Only show if within 10% of the gap to the nearest neighbor
      const prev = days[bestIdx - 1];
      const next = days[bestIdx + 1];
      const gapPrev = prev !== undefined ? days[bestIdx] - prev : Infinity;
      const gapNext = next !== undefined ? next - days[bestIdx] : Infinity;
      const threshold = Math.min(gapPrev, gapNext) * 0.10;

      return bestDist <= threshold ? fmtDate(window._mmSessions[bestIdx].date) : "";
    }
    const lblS = document.getElementById("mm-lbl-start");
    const lblE = document.getElementById("mm-lbl-end");
    if (lblS) lblS.textContent = labelForFrac(rs);
    if (lblE) lblE.textContent = labelForFrac(re);
  }
}

// ── Settings sheet swipe-to-close ────────────────────────────
function startSettingsDrag(e) {
  e.stopPropagation();
  const startY = e.touches ? e.touches[0].clientY : e.clientY;
  const sheet = document.querySelector('.settings-sheet');
  if (!sheet) return;
  let dy = 0;

  const move = ev => {
    if (ev.cancelable) ev.preventDefault();
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    dy = Math.max(0, cy - startY); // only allow downward drag
    sheet.style.transform = `translateY(${dy}px)`;
    sheet.style.transition = 'none';
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', up);
    if (dy > 80) {
      // Enough drag — animate out then close
      sheet.style.transition = 'transform 0.2s ease';
      sheet.style.transform = 'translateY(100%)';
      setTimeout(() => { settingsOpen = false; render(); }, 200);
    } else {
      // Snap back
      sheet.style.transition = 'transform 0.2s ease';
      sheet.style.transform = 'translateY(0)';
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', up);
}

load(); render();

if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'strength-log-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys => Promise.all(
          keys.filter(k => k !== CACHE).map(k => caches.delete(k))
        ))
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => cached))
      );
    });
    // Cache the app shell on first visit
    self.addEventListener('install', e => {
      e.waitUntil(
        caches.open(CACHE).then(cache => cache.addAll([self.registration.scope]))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
