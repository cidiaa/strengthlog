<link rel="manifest" href="data:application/json,{%22name%22:%22Strength%20Log%22,%22short_name%22:%22Lift%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f0f0f%22,%22theme_color%22:%22%230f0f0f%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%253Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20512%20512%27%253E%253Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%27100%27%20fill%3D%27%230f0f0f%27%2F%253E%253Ctext%20x%3D%27256%27%20y%3D%27340%27%20text-anchor%3D%27middle%27%20font-size%3D%27300%27%20fill%3D%27%23c8f55a%27%253E%25F0%259F%2592%25AA%253C%2Ftext%253E%253C%2Fsvg%253E%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22}]}">
<title>Strength Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Themes ─────────────────────────────────────── */
  :root {
    --accent: #c8f55a;
    --accent-dim: #8aaa2e;
    --accent-bg: #1a2200;
    --accent-border: #2a3a00;
    --accent-dark: #0f0f0f;
    --secondary: #5ab4f5;
    --secondary-bg: #1e3a4a;
    --tertiary: #a78bfa;
    --tertiary-bg: #2a1f40;
    --bg: #0f0f0f;
    --surface: #161616;
    --surface2: #1a1a1a;
    --border: #222;
    --border2: #1e1e1e;
    --text: #e8e8e8;
    --text-dim: #666;
    --text-mute: #444;
    /* Graph colors — used in SVG via JS getComputedStyle */
    --graph-line: #5ab4f5;
    --graph-area: #5ab4f5;
    --graph-dot-active: #c8f55a;
    --graph-dot-latest: #5ab4f5;
    --graph-bw: #a78bfa;
    --graph-badge: #f5a05a;
    --minimap-line: #5ab4f5;
    --minimap-dim: #252525;
  }
  [data-theme="ocean"] {
    --accent: #38bdf8;
    --accent-dim: #0ea5e9;
    --accent-bg: #0c1e2e;
    --accent-border: #1e3a50;
    --accent-dark: #060f18;
    --secondary: #818cf8;
    --secondary-bg: #1e1f3a;
    --tertiary: #34d399;
    --tertiary-bg: #0d2e22;
    --bg: #060f18;
    --surface: #0d1b28;
    --surface2: #122030;
    --border: #1a3040;
    --border2: #142535;
    --text: #e2f0ff;
    --text-dim: #4a7090;
    --text-mute: #2a4560;
    --graph-line: #818cf8;
    --graph-area: #818cf8;
    --graph-dot-active: #38bdf8;
    --graph-dot-latest: #818cf8;
    --graph-bw: #34d399;
    --graph-badge: #38bdf8;
    --minimap-line: #818cf8;
    --minimap-dim: #1a3040;
  }
  [data-theme="ember"] {
    --accent: #fb923c;
    --accent-dim: #ea580c;
    --accent-bg: #2a1100;
    --accent-border: #3a1a00;
    --accent-dark: #0f0800;
    --secondary: #fb923c;
    --secondary-bg: #2a1500;
    --tertiary: #fbbf24;
    --tertiary-bg: #2a1e00;
    --bg: #100800;
    --surface: #1a0e00;
    --surface2: #201200;
    --border: #2e1a00;
    --border2: #241400;
    --text: #fff0e6;
    --text-dim: #6b4020;
    --text-mute: #4a2a10;
    --graph-line: #fb923c;
    --graph-area: #fb923c;
    --graph-dot-active: #fbbf24;
    --graph-dot-latest: #fb923c;
    --graph-bw: #fbbf24;
    --graph-badge: #ea580c;
    --minimap-line: #fb923c;
    --minimap-dim: #2e1a00;
  }
  [data-theme="mono"] {
    --accent: #e8e8e8;
    --accent-dim: #aaaaaa;
    --accent-bg: #1e1e1e;
    --accent-border: #2a2a2a;
    --accent-dark: #0a0a0a;
    --secondary: #aaaaaa;
    --secondary-bg: #1e1e1e;
    --tertiary: #777777;
    --tertiary-bg: #1a1a1a;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: #222;
    --border2: #1c1c1c;
    --text: #e8e8e8;
    --text-dim: #555;
    --text-mute: #333;
    --graph-line: #aaaaaa;
    --graph-area: #aaaaaa;
    --graph-dot-active: #e8e8e8;
    --graph-dot-latest: #aaaaaa;
    --graph-bw: #777777;
    --graph-badge: #aaaaaa;
    --minimap-line: #aaaaaa;
    --minimap-dim: #222;
  }

  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', 'Courier New', monospace; min-height: 100vh; }
  #app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 72px); }
  .label-sm { font-size: 11px; color: var(--accent-dim); letter-spacing: 3px; margin-bottom: 4px; }
  .title { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; margin-bottom: 24px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; padding: 7px 10px; background: var(--surface2); color: var(--text-dim); border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
  .tab-btn.active { background: var(--accent); color: var(--accent-dark); }
  .tab-btn.bwtab.active { background: var(--tertiary); color: var(--accent-dark); }
  .tab-note { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 16px; }
  .ex-list { display: flex; flex-direction: column; gap: 10px; }
  .ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .ex-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
  .ex-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .ex-sub { font-size: 11px; color: var(--text-dim); line-height: 1.7; }
  .w { color: var(--accent); }
  .dw { color: var(--accent-dim); }
  .dr { color: var(--secondary); }
  .dv { color: #f5a05a; }
  .dsep { color: var(--border); margin: 0 3px; }
  .log-btn { background: var(--accent); color: var(--accent-dark); border: none; border-radius: 3px; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; margin-right: 4px; flex-shrink: 0; }
  .stats-btn { background: transparent; color: var(--secondary); border: 1px solid var(--secondary-bg); border-radius: 3px; padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-right: 4px; flex-shrink: 0; transition: background 0.15s, color 0.15s; }
  .stats-btn:hover { background: var(--secondary-bg); }
  .manage-btn { background: transparent; color: var(--text-dim); border: 1px solid var(--border2); border-radius: 3px; padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-right: 4px; flex-shrink: 0; transition: background 0.15s; }
  .manage-btn:hover { background: var(--border2); color: var(--text); }
  .chevron { color: var(--text-dim); font-size: 10px; flex-shrink: 0; }
  .history { border-top: 1px solid var(--border); padding: 10px 14px; display: none; }
  .history.open { display: block; }
  .history-label { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 8px; }
  .hrow { display: grid; grid-template-columns: 58px 1fr 1fr 1fr; align-items: center; font-size: 11px; padding: 6px 0; border-bottom: 1px solid var(--border2); color: var(--text-dim); gap: 40px; }
  .hrow:last-child { border-bottom: none; }
  .hrow.latest { color: var(--text); }
  .hnote { color: var(--accent-dim); font-style: italic; }
  .add-ex-btn { width: 100%; margin-top: 14px; padding: 10px; background: transparent; border: 1px dashed var(--border); color: var(--text-dim); border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 11px; letter-spacing: 1px; }


  /* BW graphs */
  .bw-graph-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .bw-graph-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; }
  .bw-graph-title { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
  .bw-graph-body { padding: 4px 14px 12px; border-top: 1px solid var(--border); }
  .bw-graph-tabs { display: flex; gap: 4px; margin-bottom: 12px; margin-top: 8px; }
  .bw-gtab { flex: 1; padding: 5px; background: var(--surface2); color: var(--text-dim); border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
  .bw-gtab.active { background: var(--tertiary); color: var(--accent-dark); }
  svg.bw-svg { width: 100%; overflow: visible; }
  .svg-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .svg-dot { cursor: pointer; transition: r 0.1s; }
  .svg-dot:hover { r: 5; }
  .svg-axis-label { font-size: 9px; fill: #555; font-family: 'IBM Plex Mono', monospace; }
  .svg-tooltip { pointer-events: none; }

  /* JSON paste section */
  .bw-paste-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .bw-paste-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; }
  .bw-paste-title { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
  .bw-paste-body { padding: 12px 14px; border-top: 1px solid var(--border); }
  .bw-paste-sub { font-size: 10px; color: #555; margin-bottom: 8px; line-height: 1.5; }
  .bw-paste-textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 8px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; outline: none; resize: vertical; min-height: 90px; }
  .bw-paste-textarea:focus { border-color: var(--text-mute); }
  .bw-paste-status { font-size: 10px; margin: 6px 0 0; min-height: 14px; }
  .bw-paste-status.ok { color: #4ade80; }
  .bw-paste-status.err { color: #f87171; }
  .bw-paste-btn { margin-top: 8px; padding: 8px 16px; background: var(--tertiary); color: var(--accent-dark); border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; }


  /* Vitamin tracker */
  .vit-header { font-size:10px; color:var(--text-dim); letter-spacing:2px; margin-bottom:12px; }
  .vit-date { font-size:11px; color:var(--accent); margin-bottom:16px; }
  .vit-list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .vit-row { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px 14px; cursor:pointer; transition:border-color 0.15s, background 0.15s; }
  .vit-row.checked { border-color:var(--accent-dim); background:color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  .vit-emoji { font-size:20px; flex-shrink:0; width:28px; text-align:center; }
  .vit-name { flex:1; font-size:13px; color:var(--text); }
  .vit-check { width:22px; height:22px; border-radius:5px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; transition:background 0.15s, border-color 0.15s; }
  .vit-row.checked .vit-check { background:var(--accent); border-color:var(--accent); color:var(--accent-dark); }
  .vit-progress-wrap { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px 14px; margin-bottom:16px; }
  .vit-progress-label { font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .vit-progress-bar { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .vit-progress-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 0.3s; }
  .vit-add-row { display:flex; gap:8px; margin-bottom:16px; }
  .vit-add-input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:4px; padding:8px 10px; font-family:inherit; font-size:12px; outline:none; }
  .vit-add-input:focus { border-color:var(--text-mute); }
  .vit-add-btn { padding:8px 14px; background:var(--accent); color:var(--accent-dark); border:none; border-radius:4px; cursor:pointer; font-family:inherit; font-size:11px; font-weight:700; flex-shrink:0; }
  .vit-delete-btn { background:none; border:none; color:#444; cursor:pointer; font-size:14px; padding:2px 4px; flex-shrink:0; }
  .vit-history-card { background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-bottom:10px; }
  .vit-history-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; cursor:pointer; }
  .vit-history-title { font-size:10px; color:var(--text-dim); letter-spacing:2px; }
  .vit-hist-row { display:flex; justify-content:space-between; align-items:center; padding:8px 14px; border-bottom:1px solid var(--surface2); font-size:11px; color:var(--text-dim); }
  .vit-hist-row:last-child { border-bottom:none; }
  .vit-hist-date { color:var(--text); }
  .vit-hist-dots { display:flex; gap:4px; }
  .vit-hist-dot { width:8px; height:8px; border-radius:50%; }

  /* BW tab */
  .bw-summary { background: var(--surface); border: 1px solid var(--tertiary-bg); border-radius: 6px; padding: 16px; margin-bottom: 10px; }
  .bw-stats { display: flex; gap: 14px; flex-wrap: wrap; }
  .bw-stat { flex: 1; min-width: 72px; }
  .bw-stat-lbl { font-size: 9px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 2px; }
  .bw-stat-val { font-size: 20px; font-weight: 700; color: var(--tertiary); }
  .bw-stat-val.pos { color: #f87171; }
  .bw-stat-val.neg { color: #4ade80; }
  .bw-unit { font-size: 10px; color: var(--text-dim); margin-left: 2px; }
  .bw-log-btn { width: 100%; padding: 10px; background: var(--tertiary); color: var(--accent-dark); border: none; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
  .bw-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .bw-card-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; }
  .bw-card-title { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
  .bw-chart { padding: 12px 14px 8px; border-top: 1px solid var(--border); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .bar-date { font-size: 10px; color: #555; width: 34px; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--surface2); border-radius: 2px; height: 13px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--tertiary); border-radius: 2px; }
  .bar-val { font-size: 10px; color: var(--tertiary); width: 56px; text-align: right; flex-shrink: 0; }
  .bw-erow { display: flex; justify-content: space-between; font-size: 11px; padding: 5px 14px; border-bottom: 1px solid var(--surface2); color: var(--text-dim); gap: 6px; }
  .bw-erow:last-child { border-bottom: none; }
  .bw-erow.latest { color: var(--text); background: var(--surface2); }
  .bw-delta.up { color: #f87171; }
  .bw-delta.dn { color: #4ade80; }

  /* Modals */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; width: 100%; max-width: 360px; }
  .mlbl { font-size: 10px; color: var(--accent-dim); letter-spacing: 2px; margin-bottom: 4px; }
  .mlbl.bw { color: var(--tertiary); }
  .mlbl.stats { color: var(--secondary); }
  .mlbl.danger { color: #f87171; }
  .mtitle { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 20px; }
  .mtitle.bw { color: var(--tertiary); }
  .mtitle.stats { color: var(--secondary); margin-bottom: 12px; }
  .mtitle.danger { color: #f87171; }
  .field { margin-bottom: 14px; }
  .flbl { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 4px; }
  .field input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 8px 10px; font-family: inherit; font-size: 12px; outline: none; }
  .field input:focus { border-color: var(--text-mute); }
  .brow { display: flex; gap: 8px; margin-top: 4px; }
  .bcnl { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; }
  .bsav { flex: 2; padding: 10px; background: var(--accent); border: none; color: var(--accent-dark); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; }
  .bsav.bw { background: var(--tertiary); }
  .bdel { flex: 2; padding: 10px; background: #f87171; border: none; color: #0f0f0f; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; }
  .catrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .catrow::-webkit-scrollbar { display: none; }
  .catbtn { flex-shrink: 0; padding: 7px 10px; background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; white-space: nowrap; }
  .catbtn.active { background: var(--accent); color: var(--accent-dark); border-color: var(--accent); }
  .empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 32px; }
  .legend { display: flex; gap: 14px; margin-top: 10px; margin-bottom: 2px; flex-wrap: wrap; }
  .li { display: flex; align-items: center; gap: 4px; font-size: 9px; color: #555; letter-spacing: 1px; }
  .ld { width: 7px; height: 7px; border-radius: 50%; }

  /* Stats Modal */
  .stats-modal { background: var(--surface); border: 1px solid var(--secondary-bg); border-radius: 8px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .stats-toggle-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .stog { padding: 5px 10px; background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; transition: all 0.15s; }
  .stog.active { background: var(--secondary-bg); color: var(--secondary); border-color: var(--secondary); }
  .stog.bw-tog.active { background: var(--tertiary-bg); color: var(--tertiary); border-color: var(--tertiary); }
  /* Range minimap */
  .range-wrap { margin-bottom: 12px; user-select: none; -webkit-user-select: none; }
  .range-presets { display: flex; gap: 5px; margin-bottom: 8px; }
  .range-preset { padding: 4px 9px; background: var(--bg); color: var(--text-mute); border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; transition: all 0.15s; }
  .range-preset.active { background: var(--surface2); color: var(--accent); border-color: var(--accent-border); }
  .range-minimap { position: relative; touch-action: none; cursor: col-resize; overflow: visible; padding: 0 8px; }
  .range-minimap svg { display: block; width: 100%; border-radius: 4px; overflow: visible; }
  .range-labels { display: flex; justify-content: space-between; margin-top: 4px; }
  .range-label { font-size: 9px; color: var(--secondary); letter-spacing: 0.5px; }
  .graph-wrap { background: var(--bg); border: 1px solid var(--border2); border-radius: 4px; padding: 8px; margin-bottom: 12px; }
  .graph-wrap svg { display: block; width: 100%; }
  .stats-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .s-stat { flex: 1; min-width: 60px; background: var(--bg); border: 1px solid var(--border2); border-radius: 4px; padding: 8px 10px; }
  .s-stat-lbl { font-size: 9px; color: #555; letter-spacing: 1.5px; margin-bottom: 2px; }
  .s-stat-val { font-size: 14px; font-weight: 700; color: var(--secondary); }
  .s-stat-val.green { color: #4ade80; }
  .s-stat-val.yellow { color: var(--accent); }
  .no-data-msg { color: var(--text-mute); font-size: 11px; text-align: center; padding: 40px 0; }

  .tab-btn.proftab.active { background: #f5a05a; color: var(--accent-dark); }

// Parse a date string — supports both MM/DD and MM/DD/YYYY.
// Returns a real JS Date object (noon local time to avoid DST edge cases).
function parseEntryDate(str) {
  if (!str) return null;
  const parts = String(str).split("/").map(Number);
  if (parts.length === 3) {
    // MM/DD/YYYY
    const [m, d, y] = parts;
    if (!m || !d || !y) return null;
    return new Date(y, m - 1, d, 12);
  }
  if (parts.length === 2) {
    // MM/DD — infer year: if the date would be in the future, use last year
    const [m, d] = parts;
    if (!m || !d) return null;
    const now = new Date();
    let year = now.getFullYear();
    const candidate = new Date(year, m - 1, d, 12);
    if (candidate - now > 86400000) candidate.setFullYear(year - 1);
    return candidate;
  }
  return null;
}

// Days since a date string (MM/DD or MM/DD/YYYY)
function daysAgo(str) {
  const d = parseEntryDate(str);
  if (!d) return null;
  return Math.round((Date.now() - d.getTime()) / 86400000);
}

function fmtDaysAgo(n) {

  if (n === 1) return "1d ago";
  return `${n}d ago`;
}

// Display format — strip year for compactness in UI
function fmtDate(str) {

// Parse plate notation: "2pl" → 90 lbs (each plate = 45 lbs, barbell = 45 lbs)
// "2pl" = 2 plates each side = 2*2*45 + 45 bar = 225... wait, convention:
// Common gym shorthand: "Npl" = N plates per side. Total = N*2*45 + 45(bar)
// 1pl=135, 2pl=225, 3pl=315, 4pl=405
// Also handle "Npl+X" e.g. "2pl+25" = 225+25 = 250
function parsePlateWeight(w) {
  if (typeof w === "number") return w;
  const s = String(w).toLowerCase().trim();
  const m = s.match(/^(\d+(?:\.\d+)?)pl(?:\+(\d+(?:\.\d+)?))?$/);
  if (m) {
    const plates = parseFloat(m[1]);
    const extra = m[2] ? parseFloat(m[2]) : 0;
    return plates * 2 * 45 + 45 + extra;
  }
  return null; // truly unparseable
}

function numericWeight(w) {

}

// Resolve the actual numeric weight for an entry — handles BW entries by

function resolveWeight(entry) {

  const s = String(w).toLowerCase().trim();
  if (s === "bw" || s === "bodyweight" || s === "body weight") {
    return getBWForDate(entry.date) ?? null;
  }
  // BW+X (e.g. "BW+25" for weighted pullups)
  const bwPlus = s.match(/^bw\+(\d+(?:\.\d+)?)$/);
  if (bwPlus) {
    const bw = getBWForDate(entry.date);
    return bw ? bw + parseFloat(bwPlus[1]) : null;
  }
  return null;
}

// Display weight — show both notation and lbs equivalent for plate weights
function fmtW(w) {
  if (typeof w === "number") return w + " lbs";
  const lbs = parsePlateWeight(w);
  if (lbs !== null) return `${w} (${lbs} lbs)`;
  return String(w);
}

function getBWForDate(date) {
  const bwEntries = Array.isArray(data["BODY"]) ? data["BODY"] : [];
  if (!bwEntries.length) return null;
  const targetKey = dateKey(date);
  // Exact date match first
  const exact = bwEntries.find(e => dateKey(e.date) === targetKey);
  if (exact) return exact.weight;
  // Fall back to most recent entry ON OR BEFORE this date
  const sorted = sortedEntries(bwEntries);
  const before = sorted.filter(e => dateKey(e.date) <= targetKey);
  if (before.length) return before[before.length - 1].weight;
  // If all entries are after this date, use the earliest one
  return sorted[0].weight;
}

// Sort key — milliseconds since epoch so MM/DD/YYYY entries sort correctly across years
function dateKey(str) {
  const d = parseEntryDate(str);

function getMondayOf(date) {

}

    const numericWeights = raws.map(e => resolveWeight(e)).filter(v => v !== null);

        ${presets.map(p => `<button class="range-preset ${isPreset(p.days)?"active":""}" onclick="setStatsPreset(${p.days})">${p.label}</button>`).join("")}
      </div>
      <div class="range-minimap" id="rtrack">
        <svg id="rsvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
          onpointerdown="minimapClick(event)" style="touch-action:none">
          ${bgRect}${monthDivs}${ticks}${dimL}${dimR}${selRect}${edgeL}${edgeR}${handleL}${handleR}
        </svg>
      </div>
      <div class="range-labels">
        <span class="range-label" id="mm-lbl-start">${startLabel}</span>
        <span class="range-label" id="mm-lbl-end">${endLabel}</span>
      </div>
    </div>`;
}

function renderStatsModal() {
  if (!statsEx || !statsTab) return "";

  // Pool + sort all entries across days
  const allSorted = sortedEntries(getAllEntriesForEx(statsEx));
  const hasResolvableWeight = allSorted.some(e => resolveWeight(e) !== null);

  // Group into sessions (one per date) — ALL sessions for history list
  const sessions = groupSessionsByDate(allSorted);

  // ── Date → real day number (Unix days, year-aware) ──────────
  function dateToDays(str) {
    const d = parseEntryDate(str);
    return d ? Math.round(d.getTime() / 86400000) : 0;
  }
  const allRawDays = sessions.map(s => dateToDays(s.date));
  const allAdjDays = allRawDays.slice(); // no year-wrap hack needed — real timestamps
  const tMinAll = allAdjDays[0] ?? 0;
  const tMaxAll = allAdjDays[allAdjDays.length-1] ?? 1;
  const tRngAll = tMaxAll - tMinAll || 1;

  // Apply range filter (statsRangeStart/End are 0–1 fractions)
  const rs = statsRangeStart ?? 0;
  const re = statsRangeEnd   ?? 1;
  const tCutStart = tMinAll + rs * tRngAll;
  const tCutEnd   = tMinAll + re * tRngAll;

  // For weight metric, filter sessions that have no numeric weight
  const metricFiltered = statsMetric === "weight"
    ? sessions.filter(s => s.topWeight !== null)
    : sessions;

  const visibleSessions = metricFiltered.filter((s, i) => {
    const t = allAdjDays[sessions.indexOf(s)];
    return t >= tCutStart - 0.5 && t <= tCutEnd + 0.5;
  });

  const W = 420, H = 170, PAD = { t:16, r: statsShowBW ? 34 : 16, b:30, l:48 };
  const IW = W - PAD.l - PAD.r;
  const IH = H - PAD.t - PAD.b;

  let graphSVG = "";
  let summaryHtml = "";
  const hasBWData = Array.isArray(data["BODY"]) && data["BODY"].length > 0;

  // ── Graph ─────────────────────────────────────────────────
  if (statsMetric === "weight" && !hasResolvableWeight) {
    graphSVG = `<div class="no-data-msg" style="padding:24px 0">
      <div style="color:#5ab4f5;margin-bottom:6px">NO NUMERIC WEIGHT</div>
      <div style="color:#444;font-size:10px">Weight "${escH(allSorted[0]?.weight ?? "")}" can't be parsed — use Npl for plates or a number. Switch to AVG REPS to see rep progress.</div>
    </div>`;
  } else if (visibleSessions.length < 2) {
    graphSVG = `<div class="no-data-msg">Log at least 2 sessions to see a graph.</div>`;
  } else {
    const vals = visibleSessions.map(s => sessionMetricVal(s)).filter(v => v !== null);
    const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1;

    const pts = visibleSessions.map((s, i) => {
      const v = sessionMetricVal(s);
      if (v === null) return null;
      const x = PAD.l + (i / (visibleSessions.length - 1)) * IW;
      const y = PAD.t + IH - ((v - mn) / rng) * IH;
      return { x, y, v, s };
    }).filter(Boolean);

    const pathD = pts.map((p, i) => `${i===0?"M":"L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
    const areaD = `${pathD} L ${pts[pts.length-1].x.toFixed(1)} ${(PAD.t+IH).toFixed(1)} L ${pts[0].x.toFixed(1)} ${(PAD.t+IH).toFixed(1)} Z`;

    // BW overlay
    let bwLine = "";
    const grLine   = cssVar('--graph-line')       || '#5ab4f5';
    const grActive = cssVar('--graph-dot-active') || '#c8f55a';
    const grLatest = cssVar('--graph-dot-latest') || '#5ab4f5';
    const grBW     = cssVar('--graph-bw')         || '#a78bfa';
    const grBadge  = cssVar('--graph-badge')      || '#f5a05a';
    const grBg     = cssVar('--bg')               || '#0f0f0f';
    if (statsShowBW && hasBWData) {
      const bwPtsRaw = pts.map(p => {
        const bw = p.s.bw;
        return bw ? { x: p.x, bw: parseFloat(bw) } : null;
      }).filter(Boolean);
      if (bwPtsRaw.length >= 2) {
        const bwVals = bwPtsRaw.map(p => p.bw);
        const bwMn = Math.min(...bwVals), bwMx = Math.max(...bwVals), bwRng = bwMx - bwMn || 1;
        const bwPts2 = bwPtsRaw.map(p => ({ ...p, y: PAD.t + IH - ((p.bw - bwMn) / bwRng) * IH }));
        const bwPath = bwPts2.map((p, i) => `${i===0?"M":"L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
        bwLine = `
          <path d="${bwPath}" fill="none" stroke="${grBW}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
          ${bwPts2.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${grBW}" opacity="0.9"/>`).join("")}
          <text x="${(W-PAD.r+4).toFixed(1)}" y="${(PAD.t+5).toFixed(1)}" font-size="8" fill="${grBW}" opacity="0.7" font-family="monospace">${bwMx.toFixed(0)}</text>
          <text x="${(W-PAD.r+4).toFixed(1)}" y="${(PAD.t+IH).toFixed(1)}" font-size="8" fill="${grBW}" opacity="0.7" font-family="monospace">${bwMn.toFixed(0)}</text>`;
      }
    }

    // Axis labels
    const yAxisLabels = `
      <text x="${(PAD.l-4).toFixed(1)}" y="${(PAD.t+4).toFixed(1)}" font-size="8" fill="#444" text-anchor="end" font-family="monospace">${mx.toFixed(statsMetric==="avg"?1:0)}</text>
      <text x="${(PAD.l-4).toFixed(1)}" y="${(PAD.t+IH/2+4).toFixed(1)}" font-size="8" fill="#444" text-anchor="end" font-family="monospace">${((mn+mx)/2).toFixed(0)}</text>
      <text x="${(PAD.l-4).toFixed(1)}" y="${(PAD.t+IH+4).toFixed(1)}" font-size="8" fill="#444" text-anchor="end" font-family="monospace">${mn.toFixed(statsMetric==="avg"?1:0)}</text>`;

    const showIdxs = [0, Math.floor((pts.length-1)/2), pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
    const xLabels = showIdxs.map(i =>
      `<text x="${pts[i].x.toFixed(1)}" y="${(PAD.t+IH+14).toFixed(1)}" font-size="8" fill="#444" text-anchor="middle" font-family="monospace">${escH(fmtDate(pts[i].s.date))}</text>`
    ).join("");

    const gridLines = [0,0.5,1].map(f => {
      const y = (PAD.t+IH*(1-f)).toFixed(1);
      return `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#1e1e1e" stroke-width="1"/>`;
    }).join("");

    // Dots — larger hit target, highlight active, multi-dot indicator
    const dots = pts.map((p, i) => {
      const isActive = statsActiveDate === p.s.date;
      const isLatest = i === pts.length - 1;
      const multiSet = p.s.raws.length > 1;
      const fill = isActive ? grActive : isLatest ? grLatest : grBg;
      const stroke = isActive ? grActive : grLine;
      const r = isActive ? 5 : isLatest ? 4 : 3;
      const badgeFill = isLatest ? grBadge : grBg;
      const prevX = i > 0 ? pts[i-1].x : 0;
      const nextX = i < pts.length - 1 ? pts[i+1].x : W;
      const bandLeft  = (p.x + prevX) / 2;
      const bandRight = (p.x + nextX) / 2;
      const bandW = bandRight - bandLeft;
      return `
        <rect x="${bandLeft.toFixed(1)}" y="0" width="${bandW.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer" onclick="setStatsDate('${escQ(p.s.date)}')"/>
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" style="pointer-events:none"/>
        ${multiSet ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="${badgeFill}" stroke="${grBadge}" stroke-width="1" style="pointer-events:none"/>` : ""}`;
    }).join("");

    graphSVG = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${gridLines}
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${grLine}" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="${grLine}" stop-opacity="0.02"/>
      </linearGradient></defs>
      <path d="${areaD}" fill="url(#sg)"/>
      <path d="${pathD}" fill="none" stroke="${grLine}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${bwLine}
      ${yAxisLabels}
      ${xLabels}
    </svg>`;

    // ── Legend hint ──
    graphSVG += `<div style="display:flex;gap:12px;padding:4px 2px 0;flex-wrap:wrap">
      <span style="font-size:9px;color:#555"><span style="color:${grLine}">●</span> top set · tap to expand</span>
      <span style="font-size:9px;color:#555"><span style="color:${grBadge}">●</span> multiple sets logged</span>
      ${statsShowBW ? `<span style="font-size:9px;color:#555"><span style="color:${grBW}">--</span> bodyweight</span>` : ""}
    </div>`;

    // ── Session detail panel (shows when a dot is tapped) ──
    if (statsActiveDate) {
      const activeSess = sessions.find(s => s.date === statsActiveDate);
      if (activeSess) {
        const sessionRM = activeSess.raws.reduce((best, e) => {
          const w = resolveWeight(e);
          if (!w) return best;
          const rm = est1RM(w, Math.max(...e.sets));
          return rm > best ? rm : best;
        }, 0) || null;

        graphSVG += `<div style="background:color-mix(in srgb,var(--accent-bg) 80%,transparent);border:1px solid var(--accent-border);border-radius:4px;padding:10px 12px;margin-top:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:10px;color:var(--accent);letter-spacing:2px">SESSION · ${escH(fmtDate(statsActiveDate))}</span>
            ${sessionRM ? `<span style="font-size:10px;color:${grLine}">1RM~${sessionRM}</span>` : ""}
          </div>
          ${activeSess.raws.map((e, i) => {
            const w = resolveWeight(e);
            const rm = w ? est1RM(w, Math.max(...e.sets)) : null;
            return `<div style="display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--border2);font-size:11px">
              <span style="color:#666;min-width:14px">${i+1}.</span>
              <span style="color:#e8e8e8;font-weight:600">${escH(fmtW(e.weight))}</span>
              <span style="color:#555">·</span>
              <span style="color:#5ab4f5">[${escH(fmtSets(e.sets))}]</span>
              ${rm ? `<span style="color:#8aaa2e;font-size:9px;margin-left:auto">~${rm} 1RM</span>` : ""}
              ${e.note ? `<span style="color:#8aaa2e;font-size:9px;font-style:italic">${escH(e.note)}</span>` : ""}
            </div>`;
          }).join("")}
          <div style="display:flex;gap:12px;padding-top:6px;font-size:9px;color:#555">
            <span>VOL: ${Math.round(activeSess.sessionVolume).toLocaleString()}</span>
            <span>AVG REPS: ${activeSess.sessionAvgReps.toFixed(1)}</span>
            ${activeSess.bw ? `<span style="color:#a78bfa">BW: ${activeSess.bw} lbs</span>` : ""}
          </div>
        </div>`;
      }
    }

    // ── Summary stats ──
    const firstV = vals[0], lastV = vals[vals.length-1];
    const prevV = vals.length >= 2 ? vals[vals.length-2] : null;
    const changeVsPrev = prevV !== null ? lastV - prevV : null;
    const changeTotal = lastV - firstV;
    const pct = firstV ? ((changeTotal/firstV)*100).toFixed(1) : null;
    const best = Math.max(...vals);
    const volumeUnit = hasResolvableWeight ? "" : " reps";
    const unit = statsMetric === "avg" ? " reps" : statsMetric === "volume" ? volumeUnit : " lbs";
    const fmt = v => statsMetric === "avg" ? v.toFixed(1) : statsMetric === "volume" ? Math.round(v).toLocaleString() : v.toFixed(0);

    const visibleEntries = visibleSessions.flatMap(s => s.raws);
    const best1RM = statsMetric === "weight" ? getBest1RM(visibleEntries) : null;
    const isFiltered = (statsRangeStart ?? 0) > 0.001 || (statsRangeEnd ?? 1) < 0.999;
    const rm1Banner = best1RM ? `
      <div style="display:flex;align-items:center;justify-content:space-between;background:#0f1a2a;border:1px solid #1e3a4a;border-radius:4px;padding:8px 12px;margin-bottom:10px">
        <span style="font-size:9px;color:#5ab4f5;letter-spacing:2px">EST. 1RM (EPLEY)${isFiltered ? " · SELECTED RANGE" : " · ALL TIME"}</span>
        <span style="font-size:18px;font-weight:700;color:#5ab4f5">${best1RM} <span style="font-size:11px;opacity:0.7">lbs</span></span>
      </div>` : "";

    summaryHtml = rm1Banner + `<div class="stats-summary">
      <div class="s-stat"><div class="s-stat-lbl">CURRENT</div><div class="s-stat-val">${fmt(lastV)}${unit}</div></div>
      <div class="s-stat"><div class="s-stat-lbl">BEST</div><div class="s-stat-val yellow">${fmt(best)}${unit}</div></div>
      ${changeVsPrev!==null?`<div class="s-stat"><div class="s-stat-lbl">vs LAST</div><div class="s-stat-val ${changeVsPrev>=0?"green":""}">${changeVsPrev>=0?"+":""}${fmt(changeVsPrev)}${unit}</div></div>`:""}
      <div class="s-stat"><div class="s-stat-lbl">ALL TIME</div><div class="s-stat-val ${changeTotal>=0?"green":""}">${changeTotal>=0?"+":""}${fmt(changeTotal)}${unit}</div></div>
      ${pct!==null?`<div class="s-stat"><div class="s-stat-lbl">TOTAL %</div><div class="s-stat-val ${changeTotal>=0?"green":""}">${changeTotal>=0?"+":""}${pct}%</div></div>`:""}
      <div class="s-stat"><div class="s-stat-lbl">SESSIONS</div><div class="s-stat-val">${sessions.length}</div></div>
    </div>`;

    // ── Session history list (grouped by date) ──
    const prDates = new Set();
    {
      let runMaxW = -Infinity;
      const repMaxByW = {};
      for (const sess of visibleSessions) {
        const w = sess.topWeight ?? -1;
        const maxRep = Math.max(...sess.raws.flatMap(e => e.sets));
        const key = sess.date;
        if (w > runMaxW) { runMaxW = w; prDates.add(key); }
        else if (w === runMaxW) {
          const prevBest = repMaxByW[w] ?? 0;
          if (maxRep > prevBest) prDates.add(key);
        }
        repMaxByW[w] = Math.max(repMaxByW[w] ?? 0, maxRep);
      }
    }

    summaryHtml += `<div class="manage-section-title" style="margin-top:14px;margin-bottom:6px">SESSION HISTORY</div>
      <div style="max-height:200px;overflow-y:auto">
      ${sessions.slice().reverse().map((sess) => {
        const isPRSess = prDates.has(sess.date);
        const isActive = statsActiveDate === sess.date;
        const v = sessionMetricVal(sess);
        const topFmt = v !== null ? fmt(v) : "—";
        return `<div onclick="setStatsDate('${escQ(sess.date)}')" style="padding:7px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;${isActive?"background:#0f1a0f;margin:0 -4px;padding-left:4px;padding-right:4px;border-radius:3px":""}">
          <div style="display:flex;align-items:baseline;gap:6px">
            <span class="mrow-date">${escH(fmtDate(sess.date))}</span>
            ${isPRSess?`<span style="color:#f5c542;font-size:10px">🏆</span>`:""}
            ${sess.raws.length>1?`<span style="color:#f5a05a;font-size:9px;letter-spacing:1px">${sess.raws.length} SETS</span>`:""}
            <span style="margin-left:auto;font-size:11px;color:${statsMetric==="weight"?"#c8f55a":"#5ab4f5"}">${topFmt}${unit}</span>
          </div>
          <div style="font-size:10px;color:#555;margin-top:2px">
            ${sess.raws.map(e => `${escH(fmtW(e.weight))} [${escH(fmtSets(e.sets))}]`).join("  ·  ")}
          </div>
        </div>`;
      }).join("")}
      </div>`;
  }

  const metricLabels = { weight: "WEIGHT", volume: "VOLUME", avg: "AVG REPS" };
  const daysWithEx = WORKOUT_DAYS.filter(d => data[d]?.[statsEx] !== undefined);
  const multiDay = daysWithEx.length > 1;
  const sliderHtml = sessions.length >= 2
    ? renderRangeSlider(tMinAll, tMaxAll, tRngAll, allAdjDays, sessions)
    : "";

  // Store for live drag label updates
  window._mmSessions = sessions;
  window._mmAdjDays  = allAdjDays;
  window._mmTMin     = tMinAll;
  window._mmTRng     = tRngAll;

  return `<div class="overlay open" onclick="if(event.target===this)closeStats()">
    <div class="stats-modal">
      <div class="mlbl stats">STATS</div>
      <div class="mtitle stats">${escH(statsEx)}</div>
      ${multiDay ? `<div style="font-size:9px;color:#5ab4f5;letter-spacing:1.5px;margin-bottom:10px;opacity:0.7">ALL DAYS COMBINED · ${daysWithEx.map(d=>d.split(' · ')[0]).join(' + ')}</div>` : ""}
      <div class="stats-toggle-row">
        ${Object.entries(metricLabels).map(([k,v]) =>
          `<button class="stog ${statsMetric===k?"active":""}" onclick="setStatsMetric('${k}')">${v}</button>`
        ).join("")}
        ${hasBWData ? `<button class="stog bw-tog ${statsShowBW?"active":""}" onclick="toggleStatsBW()">+ BODYWEIGHT</button>` : ""}
      </div>
      ${sliderHtml}
      <div class="graph-wrap">${graphSVG}</div>
      ${summaryHtml}
      <div class="brow" style="margin-top:12px">
        <button class="bcnl" onclick="closeStats()">CLOSE</button>
      </div>
    </div>
  </div>`;
}

// ────────────────────────────────────────────────────────────
// MANAGE MODAL
// ────────────────────────────────────────────────────────────
function openManage(ex, tab) {
  manageEx = ex;
  manageTab = tab || canonicalDay(ex) || activeTab;
  render();
}
function closeManage() { manageEx = null; manageTab = null; deleteExPending = false; render(); }

function deleteEntry(exName, tabName, sortedIdx) {
  if (!data[tabName] || !data[tabName][exName]) return;
  const sorted = sortedEntries(data[tabName][exName]);
  const target = sorted[sortedIdx];
  // Find and remove the matching entry from raw array
  const rawIdx = data[tabName][exName].findIndex(e =>
    e.date === target.date && e.weight === target.weight && fmtSets(e.sets) === fmtSets(target.sets)
  );
  if (rawIdx !== -1) data[tabName][exName].splice(rawIdx, 1);
  save(); render();
}

let deleteExPending = false;
function deleteExerciseConfirm() {
  if (!manageEx) return;
  deleteExPending = true;
  render();
}
function deleteExerciseCancel() {
  deleteExPending = false;
  render();
}

function deleteExercise(exName, tabName) {
  // Remove from every day that has this exercise (shared exercises live on multiple days)
  for (const day of WORKOUT_DAYS) {
    if (data[day] && exName in data[day]) {
      delete data[day][exName];
    }
    if (data.__order && data.__order[day]) {
      data.__order[day] = data.__order[day].filter(n => n !== exName);
    }
  }
  save(); manageEx = null; manageTab = null; render();
}

function deleteBWEntry(sortedIdx) {
  if (!Array.isArray(data["BODY"])) return;
  const sorted = sortedEntries(data["BODY"]);
  const target = sorted[sortedIdx];
  const rawIdx = data["BODY"].findIndex(e => e.date === target.date && e.weight === target.weight);
  if (rawIdx !== -1) data["BODY"].splice(rawIdx, 1);
  save(); render();
}

function renderManageModal() {
  if (!manageEx || !manageTab) return "";
  // Show shared entries across all days; deletions still target manageTab
  const entries = sortedEntries(getAllEntriesForEx(manageEx));
  const currentNote = getExNote(manageTab, manageEx);

  const rows = entries.length
    ? entries.slice().reverse().map((e, ri) => {
        const sortedIdx = entries.length - 1 - ri;
        const vol = typeof e.weight === "number" ? (totalReps(e.sets) * e.weight) : null;
        return `<div class="mrow">
          <div class="mrow-info">
            <div class="mrow-date">${escH(fmtDate(e.date))}</div>
            <div class="mrow-val">${escH(fmtW(e.weight))} · [${escH(fmtSets(e.sets))}]${vol ? ` · vol ${vol}` : ""}</div>
            ${e.note ? `<div class="mrow-note">${escH(e.note)}</div>` : ""}
          </div>
          <button class="del-entry-btn" onclick="deleteEntry('${escQ(manageEx)}','${escQ(manageTab)}',${sortedIdx})" style="display:inline-flex;align-items:center;gap:5px"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> DEL</button>
        </div>`;
      }).join("")
    : `<div style="color:#444;font-size:11px;padding:12px 0">No entries to manage.</div>`;

  return `<div class="overlay open" onclick="if(event.target===this)closeManage()">
    <div class="manage-modal">
      <div class="mlbl danger">MANAGE</div>
      <div class="mtitle danger">${escH(manageEx)}</div>
      <div class="manage-section-title">EXERCISE NOTE</div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <input id="ex-note-input" value="${escH(currentNote)}" placeholder="e.g. mind-muscle cue, form note…" style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:7px 9px;font-family:inherit;font-size:11px;outline:none">
        <button onclick="setExNote('${escQ(manageTab)}','${escQ(manageEx)}',document.getElementById('ex-note-input').value.trim())" style="background:var(--accent-dim);color:var(--bg);border:none;border-radius:4px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;flex-shrink:0">SAVE</button>
      </div>
      <div class="manage-section-title">ENTRIES — tap × to delete</div>

function renderSettingsInPlace() {
  // Re-render just the settings overlay without a full render() — preserves scroll position
  const el = document.querySelector(".settings-overlay");
  if (el) {
    const tmp = document.createElement("div");
    tmp.innerHTML = renderSettingsModal();
    const newEl = tmp.firstElementChild;
    if (newEl) el.replaceWith(newEl);
  }
}

function exportData() {
  try {
    const exportObj = {
      version: 3,
      exportedAt: new Date().toISOString(),
      data,                              // all workout logs, BODY, __order
      settings: { ...settings },         // name, height, age, sex, units
      theme: activeTheme,                // active theme
    };
    const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "strength-log-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert("Export failed: " + e.message); }
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);

      // Support both { data, settings } wrapper and raw data object
      const importedData    = parsed.data || parsed;
      const importedSettings = parsed.settings || null;
      const importedTheme   = parsed.theme || (importedSettings && importedSettings.__theme) || null;

      if (typeof importedData !== "object" || Array.isArray(importedData)) throw new Error("Invalid format");

      // ── Restore workout days ──────────────────────────────
      // Start from current data (preserves DEFAULT_DATA structure),
      // then overlay imported exercises. Exercises in import fully replace
      // the matching exercise in that day — don't merge entry-by-entry.
      for (const day of WORKOUT_DAYS) {
        if (!importedData[day]) continue;
        for (const [ex, entries] of Object.entries(importedData[day])) {
          if (!data[day]) data[day] = {};
          data[day][ex] = Array.isArray(entries) ? entries : [];
        }
      }

      // ── Restore BODY, vitamins, notes, exercise order ─────
      if (Array.isArray(importedData["BODY"])) {
        data["BODY"] = importedData["BODY"];
      }
      if (importedData.__order) data.__order = importedData.__order;
      if (importedData.vitamins && typeof importedData.vitamins === "object") data.vitamins = importedData.vitamins;
      if (importedData.notes && typeof importedData.notes === "object") data.notes = importedData.notes;

      // ── Restore settings (only non-empty values) ──────────
      if (importedSettings) {
        const safeFields = ["name","height","age","sex","units","weightUnit"];
        for (const field of safeFields) {
          if (importedSettings[field] !== undefined && importedSettings[field] !== "") {
            settings[field] = importedSettings[field];
          }
        }
      }
      if (importedTheme) { activeTheme = importedTheme; applyTheme(); }

      save();

      const statusEl = document.getElementById("import-status");
      if (statusEl) {
        statusEl.textContent = "✓ Import successful";
        statusEl.style.display = "block";
        statusEl.className = "import-status";
        setTimeout(() => { if(statusEl) statusEl.style.display = "none"; }, 3000);
      }
      render();
    } catch(err) {
      const statusEl = document.getElementById("import-status");
      if (statusEl) {
        statusEl.textContent = "✗ Import failed: " + err.message;
        statusEl.style.display = "block";
        statusEl.className = "import-status err";
      }
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function confirmReset() {
  if (confirm("This will delete ALL your logs permanently. Are you sure?")) {
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    save();
    settingsOpen = false;
    render();
  }
}

function getTierIndex(rm, standards) {
  if (rm >= standards[3]) return 3;
  if (rm >= standards[2]) return 2;
  if (rm >= standards[1]) return 1;
  if (rm >= standards[0]) return 0;
  return -1;
}

function getTierLabel(idx) {
  return ["BEGINNER","INTERMEDIATE","ADVANCED","ELITE"][idx] ?? "SUB-BEG";
}
function getTierClass(idx) {
  return ["beg","int","adv","eli"][idx] ?? "beg";
}

function computeProfileScores() {
  // Use most recent logged bodyweight, fall back to settings, then 183 as last resort
  const bwEntries = sortedEntries(Array.isArray(data["BODY"]) ? data["BODY"] : []);
  const latestBW = bwEntries.length ? parseFloat(bwEntries[bwEntries.length-1].weight) : null;
  const settingsBW = settings.weight ? parseFloat(settings.weight) : null;
  const bodyweight = latestBW || settingsBW || 183;

  // Scale standards to actual bodyweight
  const scaledStandards = {};
  for (const [name, ratios] of Object.entries(STRENGTH_STANDARDS)) {
    scaledStandards[name] = ratios.map(r => Math.round(r * bodyweight));
  }

  // Gather best 1RMs across all workout days
  const best1RMs = {};
  for (const day of WORKOUT_DAYS) {
    const exs = data[day] || {};
    for (const [exName, entries] of Object.entries(exs)) {
      const stdName = EX_ALIAS[exName] || (STRENGTH_STANDARDS[exName] ? exName : null);
      if (!stdName) continue;
      const rm = getBest1RM(sortedEntries(entries));
      if (rm && (!best1RMs[stdName] || rm > best1RMs[stdName])) {
        best1RMs[stdName] = rm;
      }
    }
  }

  // Score each lift against BW-scaled standards
  const scores = [];
  for (const [stdName, ratios] of Object.entries(STRENGTH_STANDARDS)) {
    const rm = best1RMs[stdName];
    if (!rm) continue;
    const standards = scaledStandards[stdName];
    const tierIdx = getTierIndex(rm, standards);
    let score;
    if (tierIdx < 0) {
      score = Math.round((rm / standards[0]) * 20);
    } else if (tierIdx === 3) {
      score = Math.min(100, 75 + Math.round(((rm - standards[3]) / standards[3]) * 25));
    } else {
      const lo = tierIdx === 0 ? 0 : standards[tierIdx - 1];
      const hi = standards[tierIdx];
      const within = (rm - lo) / (hi - lo);
      score = Math.round(tierIdx * 25 + within * 25);
    }
    scores.push({ name: stdName, rm, tierIdx, score, standards, bodyweight });
  }
  return scores;
}

function computeEnduranceScore() {
  // Endurance = avg reps across all logged sets (target: 12+ = good)
  let totalSets = 0, totalRepsAll = 0;
  for (const day of WORKOUT_DAYS) {
    for (const entries of Object.values(data[day] || {})) {
      for (const e of entries) {
        for (const r of e.sets) { totalRepsAll += r; totalSets++; }
      }
    }
  }
  if (totalSets === 0) return null;
  const avg = totalRepsAll / totalSets;
  // 6 reps → 30, 10 reps → 60, 15+ reps → 90+
  return Math.min(100, Math.round((avg / 15) * 90));
}

function computeConsistencyScore() {
  // Consistency = total sessions logged across all days (20+ = great)
  let total = 0;
  for (const day of WORKOUT_DAYS) {
    for (const entries of Object.values(data[day] || {})) {
      total += entries.length;
    }
  }
  return Math.min(100, Math.round((total / 30) * 100));
}

  "Plank":                ["Abs / Core"],
};

// Returns midnight ms for the Monday of the week that is `offsetWeeks` ago
function getWeekWindow(offsetWeeks) {
  const now = new Date();
  const monday = getMondayOf(now);
  const windowStart = new Date(monday);
  windowStart.setDate(monday.getDate() - offsetWeeks * 7);
  const windowEnd = new Date(windowStart);
  windowEnd.setDate(windowStart.getDate() + 6);
  windowEnd.setHours(23, 59, 59, 999);
  return { windowStart, windowEnd };
}

function weekWindowLabel(offsetWeeks) {
  const { windowStart, windowEnd } = getWeekWindow(offsetWeeks);
  const fmt = d => `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  if (offsetWeeks === 0) return `THIS WEEK  ${fmt(windowStart)}–${fmt(windowEnd)}`;
  if (offsetWeeks === 1) return `LAST WEEK  ${fmt(windowStart)}–${fmt(windowEnd)}`;
  return `${fmt(windowStart)}–${fmt(windowEnd)}`;
}

// State for the volume week window (0 = this Mon–Sun, 1 = last Mon–Sun, etc.)
let volWeekOffset = 0;

// Compute sets per muscle group for a given Mon–Sun calendar week
function computeWeeklyVolume(offsetWeeks) {
  const { windowStart, windowEnd } = getWeekWindow(offsetWeeks);
  const wsMs = windowStart.getTime();
  const weMs = windowEnd.getTime();

  const totals = {};
  for (const muscle of Object.keys(MUSCLE_TARGETS)) {
    totals[muscle] = { sets: 0, exercises: new Set() };
  }

  for (const day of WORKOUT_DAYS) {
    const exs = data[day] || {};
    for (const [exName, entries] of Object.entries(exs)) {
      const muscles = EX_MUSCLE_MAP[exName];
      if (!muscles) continue;
      for (const entry of entries) {
        const d = parseEntryDate(entry.date);
        if (!d) continue;
        const ms = d.getTime();
        if (ms < wsMs || ms > weMs) continue;
        const setsInEntry = entry.sets.length;
        for (const muscle of muscles) {
          if (!totals[muscle]) continue;
          const isPrimary = muscles[0] === muscle;
          totals[muscle].sets += isPrimary ? setsInEntry : Math.ceil(setsInEntry / 2);
          totals[muscle].exercises.add(exName);
        }
      }
    }
  }

  return { totals, windowStart, windowEnd };
}

// Look up which exercises in the log map to a given muscle
function getExercisesForMuscle(muscle) {
  const found = [];
  for (const day of WORKOUT_DAYS) {
    for (const exName of Object.keys(data[day] || {})) {
      const muscles = EX_MUSCLE_MAP[exName];
      if (muscles && muscles.includes(muscle) && !found.includes(exName)) {
        found.push(exName);
      }
    }
  }
  return found;
}

function renderProfile() {
  const scores = computeProfileScores();
  const endScore = computeEnduranceScore();
  const conScore = computeConsistencyScore();

  const hasData = scores.length > 0 || endScore !== null;

  if (!hasData) {
    return `<div class="prof-card">
      <div class="prof-title">FITNESS PROFILE</div>
      <div class="prof-setup">
        <div style="font-size:24px;margin-bottom:8px">📊</div>
        <div style="color:#666;margin-bottom:4px">No logged exercises yet.</div>
        <div style="color:#444">Log workouts to see your fitness profile.</div>
      </div>
    </div>`;
  }

  const avgStrengthScore = scores.length
    ? Math.round(scores.reduce((a,b) => a + b.score, 0) / scores.length)
    : 0;
  const enduranceScore = endScore ?? 0;
  const consistencyScore = conScore ?? 0;

  // Donut/pie chart segments: Strength, Endurance, Consistency
  // Using SVG arc segments
  const CX = 90, CY = 90, R = 68, INNER = 42;
  const segments = [
    { label: "STRENGTH",    value: avgStrengthScore,    color: "#5ab4f5" },
    { label: "ENDURANCE",   value: enduranceScore,      color: "#4ade80" },
    { label: "CONSISTENCY", value: consistencyScore,    color: "#f5a05a" },
  ];

  function polarToXY(cx, cy, r, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  function arcPath(cx, cy, r, inner, startDeg, endDeg, color) {
    const sweep = endDeg - startDeg;
    if (sweep <= 0) return "";
    const largeArc = sweep > 180 ? 1 : 0;
    const [ox, oy] = polarToXY(cx, cy, r, startDeg);
    const [ex2, ey2] = polarToXY(cx, cy, r, endDeg);
    const [ix, iy] = polarToXY(cx, cy, inner, endDeg);
    const [ix2, iy2] = polarToXY(cx, cy, inner, startDeg);
    return `<path d="M${ox.toFixed(2)},${oy.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${ex2.toFixed(2)},${ey2.toFixed(2)} L${ix.toFixed(2)},${iy.toFixed(2)} A${inner},${inner} 0 ${largeArc} 0 ${ix2.toFixed(2)},${iy2.toFixed(2)} Z" fill="${color}" opacity="0.9"/>`;
  }

  // Each segment gets 120° (3 equal thirds), filled proportionally to score
  const GAP = 6;
  const SLICE = 120 - GAP;
  let chartPaths = "";
  segments.forEach((seg, i) => {
    const start = i * 120 + GAP / 2;
    const filledDeg = (seg.value / 100) * SLICE;
    // background arc (empty)
    chartPaths += arcPath(CX, CY, R, INNER, start, start + SLICE, "#1e1e1e");
    // filled arc
    if (filledDeg > 0) {
      chartPaths += arcPath(CX, CY, R, INNER, start, start + filledDeg, seg.color);
    }
  });

  // Center text: overall score
  const overall = Math.round((avgStrengthScore + enduranceScore + consistencyScore) / 3);
  const overallTier = overall >= 75 ? "ELITE" : overall >= 50 ? "ADV" : overall >= 25 ? "INT" : "BEG";

  const donutSVG = `<svg viewBox="0 0 180 180" width="180" height="180">
    ${chartPaths}
    <text x="${CX}" y="${CY - 6}" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8" font-family="IBM Plex Mono, monospace">${overall}</text>
    <text x="${CX}" y="${CY + 10}" text-anchor="middle" font-size="9" fill="#555" font-family="IBM Plex Mono, monospace">OVERALL</text>
    <text x="${CX}" y="${CY + 24}" text-anchor="middle" font-size="8" fill="#888" font-family="IBM Plex Mono, monospace">${overallTier}</text>
  </svg>`;

  const legendHtml = segments.map(s =>
    `<div class="prof-leg-item"><div class="prof-leg-dot" style="background:${s.color}"></div>${s.label} ${s.value}%</div>`
  ).join("");

  // Per-lift breakdown
  const liftRows = scores.map(s => {
    const tierLabel = getTierLabel(s.tierIdx);
    const tierCls = getTierClass(s.tierIdx);
    return `<div class="prof-stat">
      <div class="prof-stat-lbl">${escH(s.name)}</div>
      <div class="prof-stat-val">${s.rm} lbs <span class="prof-tier ${tierCls}">${tierLabel}</span></div>
      <div class="prof-stat-sub">Est. 1RM · int ${s.standards[1]} / adv ${s.standards[2]} / elite ${s.standards[3]} @ ${Math.round(s.bodyweight)} lbs BW</div>
    </div>`;
  }).join("");

  const noLiftMsg = scores.length === 0
    ? `<div style="color:#444;font-size:10px;text-align:center;padding:12px">Log compound lifts (Bench, Squat, Deadlift, etc.) to see strength tiers.</div>`
    : "";

  // ── Volume tracker ──────────────────────────────────────────
  const { totals, windowStart, windowEnd } = computeWeeklyVolume(volWeekOffset);
  const isCurrentWeek = volWeekOffset === 0;
  const weekLabel = weekWindowLabel(volWeekOffset);

  const volRows = Object.entries(MUSCLE_TARGETS).map(([muscle, target]) => {
    const actual = totals[muscle]?.sets ?? 0;
    const exNames = getExercisesForMuscle(muscle);
    const trackedInWindow = [...(totals[muscle]?.exercises ?? [])];

    const pct = Math.min(100, Math.round((actual / target.max) * 100));
    const isUnder = actual < target.min;
    const isOver  = actual > target.max;
    const isGood  = !isUnder && !isOver;

    const barColor = actual === 0 ? "#222"
      : isUnder ? "#f87171"
      : isOver  ? "#a78bfa"
      : "#c8f55a";

    const statusColor = actual === 0 ? "#444"
      : isUnder ? "#f87171"
      : isOver  ? "#a78bfa"
      : "#4ade80";

    const statusLabel = actual === 0 ? "NO DATA"
      : isUnder ? "UNDER"
      : isOver  ? "OVER"
      : "ON TRACK";

    const exListStr = exNames.length
      ? exNames.map(e => trackedInWindow.includes(e) ? `<span style="color:#8aaa2e">${escH(e)}</span>` : `<span style="color:#333">${escH(e)}</span>`).join(", ")
      : `<span style="color:#333">none mapped</span>`;

    return `<div class="vol-row">
      <div class="vol-left">
        <div class="vol-muscle">
          ${escH(muscle)}
        </div>
        <div class="vol-exlist">${exListStr}</div>
        <div class="vol-bar-track">
          <div class="vol-bar-fill" style="width:${pct}%;background:${barColor}"></div>
        </div>
      </div>
      <div class="vol-right">
        <div class="vol-count" style="color:${barColor}">${actual}</div>
        <div class="vol-target">${target.min}–${target.max} sets</div>
        <div class="vol-status" style="color:${statusColor}">${statusLabel}</div>
      </div>
    </div>`;
  }).join("");

  const onTrackCount  = Object.entries(MUSCLE_TARGETS).filter(([m, t]) => { const a = totals[m]?.sets ?? 0; return a >= t.min && a <= t.max; }).length;
  const underCount    = Object.entries(MUSCLE_TARGETS).filter(([m, t]) => { const a = totals[m]?.sets ?? 0; return a > 0 && a < t.min; }).length;
  const noDataCount   = Object.entries(MUSCLE_TARGETS).filter(([m])    => (totals[m]?.sets ?? 0) === 0).length;

  const volSummaryChips = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:3px;background:#1a2a1a;color:#4ade80" style="display:inline-flex;align-items:center;gap:4px"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><polyline points="20,6 9,17 4,12"/></svg> ${onTrackCount} on track</span>
      ${underCount ? `<span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:3px;background:#2a1a1a;color:#f87171">↓ ${underCount} under</span>` : ""}
      ${noDataCount ? `<span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:3px;background:#1a1a1a;color:#555">· ${noDataCount} no data</span>` : ""}
    </div>`;

  const volWeekNav = `
    <div class="vol-week-nav">
      <button class="vol-week-btn" onclick="volWeekOffset++;render()">◀</button>
      <div class="vol-week-label">${weekLabel}</div>
      <button class="vol-week-btn" ${isCurrentWeek ? "disabled style=\"opacity:0.3\"" : ""} onclick="if(volWeekOffset>0){volWeekOffset--;render()}">▶</button>
    </div>`;

  const volLegend = `<div style="font-size:9px;color:#444;margin-bottom:10px;line-height:1.7">
    Highlighted exercise names = logged this window. Grey = in your split but no entries yet.
    Compounds (e.g. rows) credit primary muscle fully, secondary at 50%.
  </div>`;

  // 100/100 easter egg
  const isMaxed = overall >= 100;
  const easterEgg = isMaxed ? `
    <div class="prof-card" style="border-color:#f5c542;background:linear-gradient(135deg,#1a1500 0%,#161616 60%)">
      <div style="text-align:center;padding:8px 0 4px">
        <div style="font-size:32px;margin-bottom:8px">🏆</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:3px;color:#f5c542;margin-bottom:6px">MAXED OUT</div>
        <div style="font-size:12px;color:#e8e8e8;margin-bottom:6px">Overall score: <strong style="color:#f5c542">100/100</strong></div>
        <div style="font-size:10px;color:#888;line-height:1.7;max-width:280px;margin:0 auto">
          You've hit elite strength standards, consistent rep ranges, and a full log history. Seriously impressive.
          <br><br>
          <span style="color:#666">The scores don't go higher — but the weights do. Keep pushing.</span>
        </div>
      </div>
    </div>` : "";

  const bwEntries = sortedEntries(Array.isArray(data["BODY"]) ? data["BODY"] : []);
  const latestBW = bwEntries.length ? parseFloat(bwEntries[bwEntries.length-1].weight) : null;
  const displayBW = latestBW || (settings.weight ? parseFloat(settings.weight) : null);
  const heightStr = settings.height || "";
  const sexStr = settings.sex ? settings.sex.toUpperCase() : "";
  const profileSubtitle = [
    heightStr,
    sexStr,
    displayBW ? `${Math.round(displayBW * 10) / 10} LBS` : null,
  ].filter(Boolean).join(" · ");

  return `
    ${easterEgg}
    <div class="prof-card">
      <div class="prof-title">FITNESS PROFILE${profileSubtitle ? ` — ${profileSubtitle}` : ""}</div>
      <div class="prof-chart-wrap">${donutSVG}</div>
      <div class="prof-legend">${legendHtml}</div>
    </div>
    <div class="prof-card">
      <div class="prof-title">STRENGTH CLASSIFICATION</div>
      <div style="font-size:9px;color:#444;margin-bottom:10px;letter-spacing:1px">BASED ON EST. 1RM vs BODYWEIGHT-RELATIVE STANDARDS</div>
      <div class="prof-stat-grid">${liftRows}${noLiftMsg}</div>
    </div>
    <div class="prof-card">
      <div class="prof-title">SCORE BREAKDOWN</div>
      <div class="prof-stat-grid">
        <div class="prof-stat">
          <div class="prof-stat-lbl">STRENGTH INDEX</div>
          <div class="prof-stat-val" style="color:#5ab4f5">${avgStrengthScore}/100</div>
          <div class="prof-stat-sub">Avg across tracked lifts</div>
        </div>
        <div class="prof-stat">
          <div class="prof-stat-lbl">ENDURANCE INDEX</div>
          <div class="prof-stat-val" style="color:#4ade80">${enduranceScore}/100</div>
          <div class="prof-stat-sub">Avg reps per set across log</div>
        </div>
        <div class="prof-stat">
          <div class="prof-stat-lbl">CONSISTENCY</div>
          <div class="prof-stat-val" style="color:#f5a05a">${consistencyScore}/100</div>
          <div class="prof-stat-sub">${Math.round(consistencyScore * 30 / 100)} / 30 sets logged</div>
        </div>
        <div class="prof-stat">
          <div class="prof-stat-lbl">OVERALL</div>
          <div class="prof-stat-val" style="${isMaxed ? "color:#f5c542" : ""}">${overall}/100</div>
          <div class="prof-stat-sub">Composite score</div>
        </div>
      </div>
    </div>
    <div class="prof-card">
      <div class="prof-title">WEEKLY VOLUME TRACKER</div>
      ${volWeekNav}
      ${volSummaryChips}
      ${volLegend}
      ${volRows}
    </div>`;
}

function renderSearchResults() {

  for (const day of WORKOUT_DAYS) {
    const exs = Object.keys(data[day] || {});
    for (const ex of exs) {
      if (ex.toLowerCase().includes(q)) {
        hits.push({ ex, day });
      }
    }

  if (!hits.length) {
    return `<div class="search-empty">No exercises matching "<strong>${escH(searchQuery)}</strong>"</div>`;

      return `<div class="ex-card">

              <span class="search-day-badge">${escH(day)}</span>

function getVitChecked() {
  if (!data.vitamins) data.vitamins = {};
  return !!data.vitamins[today()];
}
function toggleVitamin() {
  if (!data.vitamins) data.vitamins = {};
  data.vitamins[today()] = !data.vitamins[today()];
  save(); render();
}

function renderVitamins() {
  const checked = getVitChecked();
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const d = new Date();
  const dayStr = dayNames[d.getDay()] + ", " + (d.getMonth()+1) + "/" + d.getDate();

  // Last 7 days streak — use MM/DD/YYYY keys to match today()
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dd = new Date(); dd.setDate(dd.getDate() - i);
    const key = String(dd.getMonth()+1).padStart(2,"0") + "/" + String(dd.getDate()).padStart(2,"0") + "/" + dd.getFullYear();
    const displayKey = String(dd.getMonth()+1).padStart(2,"0") + "/" + String(dd.getDate()).padStart(2,"0");
    days.push({ key, displayKey, checked: !!(data.vitamins && data.vitamins[key]) });
  }
  const streak = [...days].reverse().findIndex(d => !d.checked);
  const streakCount = streak === -1 ? 7 : streak;

  const dots = days.map(d => `
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:10px;height:10px;border-radius:50%;background:${d.checked ? "var(--accent)" : "var(--surface2)"}"></div>
      <span style="font-size:8px;color:#444">${d.displayKey.slice(3)}</span>
    </div>`).join("");

  return `
    <div style="text-align:center;padding:32px 20px 20px">
      <div style="font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:6px">VITAMINS</div>

      <div onclick="toggleVitamin()" style="
        width:88px;height:88px;border-radius:20px;margin:0 auto 20px;cursor:pointer;
        border:3px solid ${checked ? "var(--accent)" : "var(--border)"};
        background:${checked ? "color-mix(in srgb, var(--accent) 12%, var(--surface))" : "var(--surface)"};
        display:flex;align-items:center;justify-content:center;
        font-size:40px;transition:all 0.2s;
        box-shadow:${checked ? "0 0 24px color-mix(in srgb, var(--accent) 25%, transparent)" : "none"}
      ">${checked ? "✓" : ""}</div>

      <div style="font-size:13px;color:${checked ? "var(--accent)" : "var(--text-dim)"};margin-bottom:32px;font-weight:${checked ? 700 : 400}">
        ${checked ? "Taken today ✓" : "Tap to mark as taken"}
      </div>

// ── PROGRESS TAB ─────────────────────────────────────────────
function renderProgressTab() {
  // Collect all exercises that have entries, grouped by muscle/day
  const allExercises = [];
  for (const day of WORKOUT_DAYS) {
    for (const ex of getExOrder(day)) {
      const entries = sortedEntries(getAllEntriesForEx(ex));
      if (entries.length === 0) continue;
      // Avoid duplicates (shared exercises appear on multiple days)
      if (allExercises.find(e => e.name === ex)) continue;
      const delta = getDelta(entries);
      const last = entries[entries.length - 1];
      allExercises.push({ name: ex, day, entries, delta, last });
    }
  }

  if (allExercises.length === 0) {
    return `<div style="padding:40px 0;text-align:center;color:var(--text-mute);font-size:12px">Log some workouts to see progress here.</div>`;
  }

  const rows = allExercises.map(e => {
    const deltaHtml = e.delta
      ? (e.delta.type === "weight"
          ? `<span class="prog-ex-delta pos">${escH(e.delta.wv)}</span>`
          : `<span class="prog-ex-delta pos">${escH(e.delta.av)}</span>`)
      : "";
    const lastStr = e.last ? `${escH(fmtW(e.last.weight))} · [${escH(fmtSets(e.last.sets))}]` : "";
    return `<div class="prog-ex-row" onclick="openStats('${escQ(e.name)}');activeNav='LOG'">
      <div>
        <div class="prog-ex-name">${escH(e.name)}</div>
        <div class="prog-ex-sub">${lastStr}</div>
      </div>
      <div>${deltaHtml}</div>
    </div>`;
  }).join("");

  return `
    <div class="prog-section-title">ALL EXERCISES WITH DATA</div>
    <div class="prog-ex-grid">${rows}</div>
    <div class="prog-section-title" style="margin-top:24px">FITNESS PROFILE</div>
    ${renderProfile()}
  `;
}

// ────────────────────────────────────────────────────────────
// DRAG REORDER
// ────────────────────────────────────────────────────────────
// Exercise order is stored as an array in data.__order[tab]
function getExOrder(tab) {
  const keys = Object.keys(data[tab] || {}).filter(k => k !== "__order");
  const saved = data.__order && data.__order[tab];
  if (!saved) return keys;
  // Merge: saved order first, then any new exercises not yet in saved
  const ordered = saved.filter(k => keys.includes(k));
  const extra = keys.filter(k => !ordered.includes(k));
  return [...ordered, ...extra];
}

function saveExOrder(tab, order) {
  if (!data.__order) data.__order = {};
  data.__order[tab] = order;
  save();
}

// Long-press detection for mobile
let longPressTimer = null;
let longPressFired = false;

function onCardPointerDown(e, ex) {
  longPressFired = false;
  longPressTimer = setTimeout(() => {
    longPressFired = true;
    startDrag(ex, e.currentTarget.closest('.ex-card'));
  }, 400);
}

function onCardPointerUp() {
  clearTimeout(longPressTimer);
}

function onCardPointerMove(e) {
  // Cancel long press if finger moves significantly
  clearTimeout(longPressTimer);
}

// Active touch drag state
let touchDragEl = null;
let touchDragEx = null;
let touchDragClone = null;
let touchDragOffsetY = 0;

function startDrag(ex, cardEl) {
  touchDragEx = ex;
  touchDragEl = cardEl;
  cardEl.classList.add('dragging');
  // Haptic if available
  if (navigator.vibrate) navigator.vibrate(30);
}

function onCardTouchMove(e, ex) {
  if (!touchDragEx) return;
  e.preventDefault();
  const touch = e.touches[0];
  const allCards = [...document.querySelectorAll('.ex-card[data-ex]')];
  for (const card of allCards) {
    const rect = card.getBoundingClientRect();
    if (touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
      const overEx = card.getAttribute('data-ex');
      if (overEx && overEx !== touchDragEx) {
        allCards.forEach(c => c.classList.remove('drag-over'));
        card.classList.add('drag-over');
        dragOverEx = overEx;
      }
      break;
    }
  }
}

function onCardTouchEnd(e, ex) {
  if (!touchDragEx) return;
  document.querySelectorAll('.ex-card').forEach(c => {
    c.classList.remove('dragging', 'drag-over');
  });
  if (dragOverEx && dragOverEx !== touchDragEx) {
    reorderExercise(activeTab, touchDragEx, dragOverEx);
  }
  touchDragEx = null;
  touchDragEl = null;
  dragOverEx = null;
}

// Desktop drag events
function onDragStart(e, ex) {
  dragSrcEx = ex;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.ex-card').classList.add('dragging'), 0);
}

function onDragOver(e, ex) {
  e.preventDefault();
  if (ex === dragSrcEx) return;
  document.querySelectorAll('.ex-card').forEach(c => c.classList.remove('drag-over'));
  e.target.closest('.ex-card')?.classList.add('drag-over');
  dragOverEx = ex;
}

function onDragEnd(e) {
  document.querySelectorAll('.ex-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
  if (dragOverEx && dragSrcEx && dragOverEx !== dragSrcEx) {
    reorderExercise(activeTab, dragSrcEx, dragOverEx);
  }
  dragSrcEx = null;
  dragOverEx = null;
}

function reorderExercise(tab, srcEx, overEx) {
  const order = getExOrder(tab);
  const fromIdx = order.indexOf(srcEx);
  const toIdx = order.indexOf(overEx);
  if (fromIdx === -1 || toIdx === -1) return;
  order.splice(fromIdx, 1);
  order.splice(toIdx, 0, srcEx);
  saveExOrder(tab, order);
  render();
}

function renderWorkout() {
  const exs = getExOrder(activeTab);
  return `
    <div class="ex-list" id="ex-list">
      ${exs.length===0 ? '<div class="empty">No exercises yet.</div>' : exs.map(renderCard).join("")}
    </div>
    <button class="add-ex-btn" onclick="openNewEx()">+ ADD EXERCISE</button>`;
}

function renderCard(ex) {
  // Use shared entries pooled across all days that have this exercise
  const rawEntries = getAllEntriesForEx(ex);
  const entries = sortedEntries(rawEntries);
  const last = entries.length ? entries[entries.length-1] : null;
  const delta = getDelta(entries);
  const isOpen = expanded[activeTab+"|"+ex];

  let dhtml = "";
  if (delta) {
    dhtml = `<br><span class="dw">${escH(delta.wv)}</span>`;
  }

  const sub = last
