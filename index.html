<body>
<div id="app"></div>
<script>
const SPLIT_META = {
  "MON · Push":  "2x6-8 unless marked",
  "TUE · Pull":  "2x5-8 unless marked",
  "WED · Legs":  "Mixed rep ranges",
  "FRI · Upper": "2x6-8 unless marked",
  "SAT · Legs":  "Mixed rep ranges",
  "BODY":        "Weight · body fat · muscle mass",
  "PROFILE":     "Strength · endurance · fitness classification",
};
const WORKOUT_DAYS = ["MON · Push","TUE · Pull","WED · Legs","FRI · Upper","SAT · Legs"];
const ALL_TABS = [...WORKOUT_DAYS, "BODY", "PROFILE"];

const DEFAULT_DATA = {
  // Canonical day for each exercise owns the entries.
  // Shared exercises (appear on multiple days) are empty on secondary days —
  // getAllEntriesForEx() pools them at read time, canonicalDay() routes writes.
  "MON · Push": {
    "Incline Bench": [{date:"05/04",weight:135,sets:[10,15]},{date:"05/07",weight:155,sets:[8,6],bw:182.8,note:"sample log"}],
    "Pec Dec": [
      {date:"05/04",weight:115,sets:[15]},
      {date:"05/04",weight:130,sets:[18]},
      {date:"05/07",weight:145,sets:[16,14]},
    ],
    "JM Press / Tricep Pushdown": [
      {date:"05/04",weight:90,sets:[15]},
      {date:"05/04",weight:110,sets:[13]},
      {date:"05/07",weight:110,sets:[18,15]},
    ],
    "Lateral Raises": [
      {date:"05/04",weight:20,sets:[8,15]},
      {date:"05/07",weight:25,sets:[9,8,7]},
    ],
  },
  "TUE · Pull": {
    "Pull-Ups": [],
    "Lat Pulldowns": [],
    "T-Bar Rows": [
      {date:"05/04",weight:"2pl",sets:[7,7]},
      {date:"05/07",weight:"2pl",sets:[11,11]},
    ],
    "Preacher Curls": [{date:"05/04",weight:80,sets:[14]}],
    "Hammer Curls": [{date:"05/04",weight:40,sets:[9,7]}],
    "Rear Delt Fly": [{date:"05/04",weight:100,sets:[8]}],
    "Ab Cable Crunch": [],
    "Wrist Cable Curls": [],
  },
  "WED · Legs": {
    "Leg Extensions": [], "Smith Squat": [], "Lying Hamstring Curls": [],
    "Bulgarian Split Squats": [], "Calf Raises": [], "RDLs": [],
  },
  "FRI · Upper": {
    // Shared with MON · Push — entries stored there, empty here
    "Incline Bench": [],
    "Pull-Ups": [],
    "T-Bar Rows": [],
    // Shared with MON · Push — entries stored there, empty here
    "Pec Dec": [],
    // Shared with MON · Push — entries stored there, empty here
    "JM Press / Tricep Pushdown": [],
    // Shared with TUE · Pull — entries stored there, empty here
    "Preacher Curls": [],
    "Shoulder / Strict Press": [],
    "Barbell Rows": [],
  },
  "SAT · Legs": {
    "Leg Extensions": [], "RDLs": [], "Squat": [],
    "Lying Hamstring Curls": [], "Bulgarian Split Squats": [], "Calf Raises": [],
  },
  "BODY": [
    {date:"05/07",weight:182.8,note:"sample weigh-in"}
  ],
};

// State
let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
let activeTab = ALL_TABS[0];
let expanded = {};
let addingEx = null;
let addingNew = false;
let addNewTab = ALL_TABS[0];
let addingBW = false;
let bwHistOpen = false;
let searchQuery = "";
let searchLogTarget = null; // {ex, tab} for search-result log modal

// Stats state
let statsEx = null;      // exercise name
let statsTab = null;     // which day
let statsShowBW = false; // toggle body weight overlay
let statsMetric = "weight"; // "weight" | "volume" | "avg"

// Manage state
let manageEx = null;
let manageTab = null;

// Drag reorder state
let dragSrcEx = null;
let dragOverEx = null;

// Per-exercise notes (stored in data.notes = { "DAY|ExName": "note text" })
function getExNote(tab, ex) {
  return (data.notes && data.notes[tab+"|"+ex]) || "";
}
function setExNote(tab, ex, txt) {
  if (!data.notes) data.notes = {};
  if (txt) data.notes[tab+"|"+ex] = txt;
  else delete data.notes[tab+"|"+ex];
  save(); render();
}

function save() { try { localStorage.setItem("wt-v3", JSON.stringify(data)); } catch(e){} }
function load() {
  try {
    const s = localStorage.getItem("wt-v3");
    if (s) {
      const p = JSON.parse(s);
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      for (const day of WORKOUT_DAYS) {
        if (p[day]) {
          for (const [ex, entries] of Object.entries(p[day])) {
            data[day][ex] = entries;
          }
        }
      }
      for (const key of Object.keys(p)) {
        if (!WORKOUT_DAYS.includes(key)) data[key] = p[key];
      }
      // De-duplicate shared exercises: keep entries only on canonicalDay,
      // clear them from secondary days to prevent stats doubling.
      dedupeSharedExercises();
    }
  } catch(e) {}
}

// Finds exercises that appear on multiple days and consolidates their entries
// onto the first (canonical) day, clearing duplicates from the rest.
function dedupeSharedExercises() {
  // Build a map: exName -> [days that have it]
  const exDays = {};
  for (const day of WORKOUT_DAYS) {
    for (const ex of Object.keys(data[day] || {})) {
      if (!exDays[ex]) exDays[ex] = [];
      exDays[ex].push(day);
    }
  }
  for (const [ex, days] of Object.entries(exDays)) {
    if (days.length < 2) continue;
    const canon = days[0]; // first day is canonical
    // Pool all entries from all days, de-dupe by date+weight+sets fingerprint
    const seen = new Set();
    const merged = [];
    for (const day of days) {
      for (const e of (data[day][ex] || [])) {
        const key = e.date + "|" + e.weight + "|" + (e.sets||[]).join(",");
        if (!seen.has(key)) { seen.add(key); merged.push(e); }
      }
    }
    // Write merged to canonical day, clear secondary days
    data[canon][ex] = merged;
    for (const day of days.slice(1)) {
      data[day][ex] = [];
    }
  }
  save();
}

function today() {
  const d = new Date();
  return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}
function totalReps(sets) { return sets.reduce((a,b)=>a+b,0); }
function avgReps(sets) { return sets.length ? totalReps(sets)/sets.length : 0; }
function fmtSets(sets) { return sets.join(" / "); }
function fmtW(w) { return typeof w==="number" ? w+" lbs" : w; }
function sgn(n) { return n>0 ? "+" : ""; }

// Days since MM/DD date (assumes current year, handles Dec→Jan wrap)
function daysAgo(mmdd) {
  if (!mmdd) return null;
  const [m, d] = mmdd.split("/").map(Number);
  if (!m || !d) return null;
  const now = new Date();
  let year = now.getFullYear();
  const candidate = new Date(year, m - 1, d);
  if (candidate > now) { candidate.setFullYear(year - 1); } // past year
  const diff = Math.round((now - candidate) / 86400000);
  return diff;
}

function fmtDaysAgo(n) {
  if (n === null) return "";
  if (n === 0) return "today";
  if (n === 1) return "1d ago";
  return `${n}d ago`;
}

// Parse plate notation: "2pl" → 90 lbs (each plate = 45 lbs, barbell = 45 lbs)
// "2pl" = 2 plates each side = 2*2*45 + 45 bar = 225... wait, convention:
// Common gym shorthand: "Npl" = N plates per side. Total = N*2*45 + 45(bar)
// 1pl=135, 2pl=225, 3pl=315, 4pl=405
// Also handle "Npl+X" e.g. "2pl+25" = 225+25 = 250
function parsePlateWeight(w) {
  if (typeof w === "number") return w;
  const s = String(w).toLowerCase().trim();
  const m = s.match(/^(\d+(?:\.\d+)?)pl(?:\+(\d+(?:\.\d+)?))?$/);
  if (m) {
    const plates = parseFloat(m[1]);
    const extra = m[2] ? parseFloat(m[2]) : 0;
    return plates * 2 * 45 + 45 + extra;
  }
  return null; // truly unparseable
}

// Get numeric weight from entry (plates or number), null if unparseable
function numericWeight(w) {
  if (typeof w === "number") return w;
  return parsePlateWeight(w);
}

// Display weight — show both notation and lbs equivalent for plate weights
function fmtW(w) {
  if (typeof w === "number") return w + " lbs";
  const lbs = parsePlateWeight(w);
  if (lbs !== null) return `${w} (${lbs} lbs)`;
  return String(w);
}

function getBWForDate(date) {
  const bwEntries = Array.isArray(data["BODY"]) ? data["BODY"] : [];
  const exact = bwEntries.find(e => e.date === date);
  if (exact) return exact.weight;
  return bwEntries.length ? bwEntries[bwEntries.length - 1].weight : null;
}

// Parse MM/DD date string into a sortable number (month*100+day)
function dateKey(d) {
  const p = String(d).split("/");
  return parseInt(p[0]||0)*100 + parseInt(p[1]||0);
}

function sortedEntries(entries) {
  return entries.slice().sort((a,b) => dateKey(a.date) - dateKey(b.date));
}

function getDelta(entries) {
  const sorted = sortedEntries(entries);
  if (sorted.length < 2) return null;
  const prev = sorted[sorted.length - 2];
  const last = sorted[sorted.length - 1];
  const pw = numericWeight(prev.weight);
  const lw = numericWeight(last.weight);
  if (pw !== null && lw !== null) {
    const wd = lw - pw;
    if (wd !== 0) return { type:"weight", wv: sgn(wd) + Math.abs(wd) + " lbs" };
  }
  return null;
}

// Epley estimated 1RM
function est1RM(weight, reps) {
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}

function getBest1RM(entries) {
  let best = 0;
  for (const e of entries) {
    const w = numericWeight(e.weight);
    if (w === null) continue;
    for (const r of e.sets) {
      const rm = est1RM(w, r);
      if (rm > best) best = rm;
    }
  }
  return best > 0 ? best : null;
}

function isPR(entries) {
  const sorted = sortedEntries(entries);
  if (sorted.length < 2) return false;
  const last = sorted[sorted.length - 1];
  const lw = numericWeight(last.weight);
  const prevEntries = sorted.slice(0, -1);

  if (lw !== null) {
    // Check weight PR
    const prevMaxW = Math.max(...prevEntries.map(e => numericWeight(e.weight) ?? 0));
    if (lw > prevMaxW) return true;
    // Same weight — check rep PR (max single set)
    const lastMaxRep = Math.max(...last.sets);
    const prevMaxRep = Math.max(...prevEntries.flatMap(e => {
      const ew = numericWeight(e.weight);
      return ew === lw ? e.sets : [];
    }), 0);
    if (lastMaxRep > prevMaxRep) return true;
  } else {
    // Non-parseable weight — PR on reps only
    const lastMaxRep = Math.max(...last.sets);
    const prevMaxRep = Math.max(...prevEntries.flatMap(e => e.sets), 0);
    if (lastMaxRep > prevMaxRep) return true;
  }
  return false;
}

function escH(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escQ(s) { return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

// ── Shared-exercise helpers ───────────────────────────────────────────────────
// Returns the canonical (first) day that owns this exercise name.
// All writes go here so every day listing the same name reads the same data.
function canonicalDay(exName) {
  for (const day of WORKOUT_DAYS) {
    if (data[day] && exName in data[day]) return day;
  }
  return activeTab;
}

// ────────────────────────────────────────────────────────────
// STATS MODAL
// ────────────────────────────────────────────────────────────
// Pool entries for the same exercise name across all workout days
function getAllEntriesForEx(exName) {
  const all = [];
  for (const day of WORKOUT_DAYS) {
    const entries = data[day]?.[exName];
    if (Array.isArray(entries)) all.push(...entries);
  }
  return all;
}

function openStats(ex, tab) {
  statsEx = ex;
  statsTab = tab || activeTab;
  statsShowBW = false;
  // Auto-select best metric using pooled entries across all days
  const entries = getAllEntriesForEx(ex);
  const hasResolvableWeight = entries.some(e => numericWeight(e.weight) !== null);
  statsMetric = hasResolvableWeight ? "weight" : "avg";
  render();
}
function closeStats() { statsEx = null; statsTab = null; render(); }
function setStatsMetric(m) { statsMetric = m; render(); }
function toggleStatsBW() { statsShowBW = !statsShowBW; render(); }

function getMetricVal(e) {
  if (statsMetric === "volume") {
    const w = numericWeight(e.weight) ?? 1;
    return totalReps(e.sets) * w;
  }
  if (statsMetric === "avg") return avgReps(e.sets);
  return numericWeight(e.weight);
}

function renderStatsModal() {
  if (!statsEx || !statsTab) return "";
  // Pool entries from ALL days that have this exercise name
  const allSorted = sortedEntries(getAllEntriesForEx(statsEx));
  const hasResolvableWeight = allSorted.some(e => numericWeight(e.weight) !== null);
  const entries = statsMetric === "weight"
    ? allSorted.filter(e => numericWeight(e.weight) !== null)
    : allSorted;

  const W = 420, H = 160, PAD = { t:16, r:statsShowBW ? 32 : 16, b:30, l:48 };
  const IW = W - PAD.l - PAD.r;
  const IH = H - PAD.t - PAD.b;

  let graphSVG = "";
  let summaryHtml = "";

  const hasBWData = Array.isArray(data["BODY"]) && data["BODY"].length > 0;

  // If on weight tab but no resolvable weights, show explanation
  if (statsMetric === "weight" && !hasResolvableWeight) {
    graphSVG = `<div class="no-data-msg" style="padding:24px 0">
      <div style="color:#5ab4f5;margin-bottom:6px">NO NUMERIC WEIGHT</div>
      <div style="color:#444;font-size:10px">Weight "${escH(allSorted[0]?.weight ?? "")}" can't be parsed. Use Npl for plates or a number. Switch to AVG REPS to see rep progress.</div>
    </div>`;
  } else if (entries.length < 2) {
    graphSVG = `<div class="no-data-msg">Need at least 2 entries to show a graph.</div>`;
  } else {
    const rawVals = entries.map(e => getMetricVal(e));
    const vals = rawVals.filter(v => v !== null);
    if (vals.length < 2) {
      graphSVG = `<div class="no-data-msg">Not enough numeric data for this metric.</div>`;
    } else {
      const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1;

      // Build points only for entries with valid values
      const pts = entries.map((e, i) => {
        const v = getMetricVal(e);
        if (v === null) return null;
        const validIdx = entries.slice(0,i+1).filter((_,j) => getMetricVal(entries[j]) !== null).length - 1;
        const totalValid = entries.filter(en => getMetricVal(en) !== null).length;
        const x = PAD.l + (totalValid <= 1 ? IW/2 : (validIdx / (totalValid - 1)) * IW);
        const y = PAD.t + IH - ((v - mn) / rng) * IH;
        return { x, y, v, e };
      }).filter(Boolean);

      const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
      const areaD = `${pathD} L ${pts[pts.length-1].x.toFixed(1)} ${(PAD.t+IH).toFixed(1)} L ${PAD.l} ${(PAD.t+IH).toFixed(1)} Z`;

      // Body weight overlay
      let bwLine = "";
      if (statsShowBW && hasBWData) {
        const bwPtsRaw = entries.map((e, i) => {
          const bw = e.bw || getBWForDate(e.date);
          if (!bw) return null;
          const validIdx = entries.slice(0,i+1).filter((_,j) => getMetricVal(entries[j]) !== null).length - 1;
          const totalValid = entries.filter(en => getMetricVal(en) !== null).length;
          const x = PAD.l + (totalValid <= 1 ? IW/2 : (validIdx / (totalValid - 1)) * IW);
          return { x, bw: parseFloat(bw) };
        }).filter(Boolean);

        if (bwPtsRaw.length >= 2) {
          const bwVals = bwPtsRaw.map(p => p.bw);
          const bwMn = Math.min(...bwVals), bwMx = Math.max(...bwVals), bwRng = bwMx - bwMn || 1;
          const bwPts = bwPtsRaw.map(p => ({
            ...p,
            y: PAD.t + IH - ((p.bw - bwMn) / bwRng) * IH
          }));
          const bwPath = bwPts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
          bwLine = `
            <path d="${bwPath}" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
            ${bwPts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="#a78bfa" opacity="0.9"/>`).join("")}
            <text x="${(W - PAD.r + 4).toFixed(1)}" y="${(PAD.t + 5).toFixed(1)}" font-size="8" fill="#a78bfa" opacity="0.7" font-family="IBM Plex Mono, monospace">${bwMx.toFixed(0)}</text>
            <text x="${(W - PAD.r + 4).toFixed(1)}" y="${(PAD.t + IH).toFixed(1)}" font-size="8" fill="#a78bfa" opacity="0.7" font-family="IBM Plex Mono, monospace">${bwMn.toFixed(0)}</text>
          `;
        }
      }

      // Y axis labels
      const yMid = ((mn + mx) / 2).toFixed(0);
      const yAxisLabels = `
        <text x="${(PAD.l - 4).toFixed(1)}" y="${(PAD.t + 4).toFixed(1)}" font-size="8" fill="#444" text-anchor="end" font-family="IBM Plex Mono, monospace">${mx.toFixed(statsMetric==="avg"?1:0)}</text>
        <text x="${(PAD.l - 4).toFixed(1)}" y="${(PAD.t + IH/2 + 4).toFixed(1)}" font-size="8" fill="#444" text-anchor="end" font-family="IBM Plex Mono, monospace">${yMid}</text>
        <text x="${(PAD.l - 4).toFixed(1)}" y="${(PAD.t + IH + 4).toFixed(1)}" font-size="8" fill="#444" text-anchor="end" font-family="IBM Plex Mono, monospace">${mn.toFixed(statsMetric==="avg"?1:0)}</text>
      `;

      // X axis date labels (first, middle, last)
      const xLabels = (() => {
        const show = [0, Math.floor((pts.length-1)/2), pts.length-1].filter((v,i,a) => a.indexOf(v)===i);
        return show.map(i => {
          return `<text x="${pts[i].x.toFixed(1)}" y="${(PAD.t + IH + 14).toFixed(1)}" font-size="8" fill="#444" text-anchor="middle" font-family="IBM Plex Mono, monospace">${escH(pts[i].e.date)}</text>`;
        }).join("");
      })();

      const gridLines = [0, 0.5, 1].map(f => {
        const y = (PAD.t + IH * (1 - f)).toFixed(1);
        return `<line x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}" stroke="#1e1e1e" stroke-width="1"/>`;
      }).join("");

      graphSVG = `
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
          ${gridLines}
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5ab4f5" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#5ab4f5" stop-opacity="0.02"/>
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#sg)"/>
          <path d="${pathD}" fill="none" stroke="#5ab4f5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${pts.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i === pts.length-1 ? 4 : 3}" fill="${i === pts.length-1 ? "#5ab4f5" : "#0f0f0f"}" stroke="#5ab4f5" stroke-width="1.5"/>`).join("")}
          ${bwLine}
          ${yAxisLabels}
          ${xLabels}
        </svg>`;

      // Summary stats vars
      const first2 = vals[0], last2 = vals[vals.length-1];
      const change = last2 - first2;
      const pct = first2 ? ((change / first2) * 100).toFixed(1) : null;
      const best = Math.max(...vals);
      const volumeUnit = hasResolvableWeight ? "" : " reps";
      const unit = statsMetric === "avg" ? " reps" : statsMetric === "volume" ? volumeUnit : " lbs";
      const fmt = v => statsMetric === "avg" ? v.toFixed(1) : statsMetric === "volume" ? Math.round(v).toLocaleString() : v.toFixed(0);

      // Best estimated 1RM (weight metric only)
      const best1RM = statsMetric === "weight" ? getBest1RM(entries) : null;
      const rm1Banner = best1RM ? `
        <div style="display:flex;align-items:center;justify-content:space-between;background:#0f1a2a;border:1px solid #1e3a4a;border-radius:4px;padding:8px 12px;margin-bottom:10px">
          <span style="font-size:9px;color:#5ab4f5;letter-spacing:2px">EST. 1 REP MAX (EPLEY)</span>
          <span style="font-size:18px;font-weight:700;color:#5ab4f5">${best1RM} <span style="font-size:11px;color:#5ab4f5;opacity:0.7">lbs</span></span>
        </div>` : "";

      summaryHtml = rm1Banner + `<div class="stats-summary">
        <div class="s-stat">
          <div class="s-stat-lbl">CURRENT</div>
          <div class="s-stat-val">${fmt(last2)}${unit}</div>
        </div>
        <div class="s-stat">
          <div class="s-stat-lbl">BEST</div>
          <div class="s-stat-val yellow">${fmt(best)}${unit}</div>
        </div>
        <div class="s-stat">
          <div class="s-stat-lbl">CHANGE</div>
          <div class="s-stat-val ${change >= 0 ? "green" : ""}">${change >= 0 ? "+" : ""}${fmt(change)}${unit}</div>
        </div>
        ${pct !== null ? `<div class="s-stat">
          <div class="s-stat-lbl">% GAIN</div>
          <div class="s-stat-val ${change >= 0 ? "green" : ""}">${change >= 0 ? "+" : ""}${pct}%</div>
        </div>` : ""}
        <div class="s-stat">
          <div class="s-stat-lbl">SESSIONS</div>
          <div class="s-stat-val">${entries.length}</div>
        </div>
      </div>`;

      // History table in stats modal
      // Pre-compute PR sessions: weight PR or rep PR at same weight
      const prDates = new Set();
      {
        let runMaxW = -Infinity;
        // track best reps per weight level
        const repMaxByW = {};
        for (const e of entries) { // sorted asc
          const w = numericWeight(e.weight) ?? -1;
          const maxRep = Math.max(...e.sets);
          const key = e.date + "|" + e.weight;
          if (w > runMaxW) { runMaxW = w; prDates.add(key); }
          else if (w === runMaxW || w === -1) {
            const prevBest = repMaxByW[w] ?? 0;
            if (maxRep > prevBest) prDates.add(key);
          }
          repMaxByW[w] = Math.max(repMaxByW[w] ?? 0, maxRep);
        }
      }

      summaryHtml += `<div class="manage-section-title" style="margin-top:14px;margin-bottom:6px">SESSION HISTORY</div>
        <div style="max-height:160px;overflow-y:auto">
        ${entries.slice().reverse().map((e,i) => {
          const v = getMetricVal(e);
          const isPREntry = prDates.has(e.date + "|" + e.weight);
          return `<div class="mrow" style="padding:6px 0">
            <div class="mrow-info">
              <span class="mrow-date">${escH(e.date)}</span>
              ${isPREntry ? `<span style="color:#f5c542;font-size:10px;margin-left:4px" title="Personal Record">🏆</span>` : ""}
              <span class="mrow-val" style="margin-left:8px">${escH(fmtW(e.weight))} · [${escH(fmtSets(e.sets))}]${v !== null ? ` · <span style="color:#5ab4f5">${statsMetric==="weight"?v+" lbs":statsMetric==="avg"?v.toFixed(1)+" avg":Math.round(v)+(hasResolvableWeight?" vol":" reps")}</span>` : ""}</span>
              ${e.note ? `<span class="mrow-note" style="margin-left:8px">${escH(e.note)}</span>` : ""}
              ${e.bw ? `<span style="color:#a78bfa;font-size:10px;margin-left:8px">BW ${e.bw}</span>` : ""}
            </div>
          </div>`;
        }).join("")}
        </div>`;
    } // end vals.length >= 2
  } // end else (entries.length >= 2 and hasNumericWeight)

  const metricLabels = { weight: "WEIGHT", volume: "VOLUME", avg: "AVG REPS" };

  // Check if this exercise appears on multiple days
  const daysWithEx = WORKOUT_DAYS.filter(d => data[d]?.[statsEx] !== undefined);
  const multiDay = daysWithEx.length > 1;

  return `<div class="overlay open" onclick="if(event.target===this)closeStats()">
    <div class="stats-modal">
      <div class="mlbl stats">STATS</div>
      <div class="mtitle stats">${escH(statsEx)}</div>
      ${multiDay ? `<div style="font-size:9px;color:#5ab4f5;letter-spacing:1.5px;margin-bottom:10px;opacity:0.7">ALL DAYS COMBINED · ${daysWithEx.map(d=>d.split(' · ')[0]).join(' + ')}</div>` : ""}
      <div class="stats-toggle-row">
        ${Object.entries(metricLabels).map(([k,v]) =>
          `<button class="stog ${statsMetric===k?"active":""}" onclick="setStatsMetric('${k}')">${v}</button>`
        ).join("")}
        ${hasBWData ? `<button class="stog bw-tog ${statsShowBW?"active":""}" onclick="toggleStatsBW()">+ BODYWEIGHT</button>` : ""}
      </div>
      <div class="graph-wrap">${graphSVG}</div>
      ${summaryHtml}
      <div class="brow" style="margin-top:12px">
        <button class="bcnl" onclick="closeStats()">CLOSE</button>
      </div>
    </div>
  </div>`;
}

// ────────────────────────────────────────────────────────────

function openManage(ex, tab) {

  manageTab = tab || activeTab;
  render();
}
function closeManage() { manageEx = null; manageTab = null; render(); }

function deleteEntry(exName, tabName, sortedIdx) {
  if (!data[tabName] || !data[tabName][exName]) return;
  const sorted = sortedEntries(data[tabName][exName]);
  const target = sorted[sortedIdx];
  // Find and remove the matching entry from raw array
  const rawIdx = data[tabName][exName].findIndex(e =>
    e.date === target.date && e.weight === target.weight && fmtSets(e.sets) === fmtSets(target.sets)
  );
  if (rawIdx !== -1) data[tabName][exName].splice(rawIdx, 1);
  save(); render();
}

function deleteExercise(exName, tabName) {
  if (!data[tabName]) return;
  delete data[tabName][exName];
  // Remove from saved order
  if (data.__order && data.__order[tabName]) {
    data.__order[tabName] = data.__order[tabName].filter(n => n !== exName);
  }
  save(); manageEx = null; manageTab = null; render();
}

function deleteBWEntry(sortedIdx) {
  if (!Array.isArray(data["BODY"])) return;
  const sorted = sortedEntries(data["BODY"]);
  const target = sorted[sortedIdx];
  const rawIdx = data["BODY"].findIndex(e => e.date === target.date && e.weight === target.weight);
  if (rawIdx !== -1) data["BODY"].splice(rawIdx, 1);
  save(); render();
}

    ? entries.slice().reverse().map((e, ri) => {

// Strength standards for 5'11" (~182cm), bodyweight ~183 lbs
// Source: Strength Level / ExRx relative strength ratios adapted for BW
// Tiers: Beginner / Intermediate / Advanced / Elite (1RM lbs)
const STRENGTH_STANDARDS = {
  // [beginner, intermediate, advanced, elite] 1RM in lbs for ~183 lb male
  "Bench Press":        [115, 185, 255, 330],
  "Squat":              [145, 230, 320, 415],
  "Deadlift":           [175, 275, 380, 490],
  "T-Bar Rows":         [100, 160, 220, 285],
  "Pull-Ups":           [115, 170, 230, 300], // bodyweight + added weight equiv
  "Incline Bench":      [95, 155, 215, 280],
  "RDLs":               [135, 215, 295, 380],
};

// Map exercise names in data to standard names (fuzzy)
const EX_ALIAS = {
  "Incline Bench": "Incline Bench",
  "Squat": "Squat",
  "Smith Squat": "Squat",
  "T-Bar Rows": "T-Bar Rows",
  "Pull-Ups": "Pull-Ups",
  "Lat Pulldowns": "Pull-Ups", // close enough standard — lat pulldown ≈ pull-up in strength profile
  "RDLs": "RDLs",
};

function getTierIndex(rm, standards) {
  if (rm >= standards[3]) return 3;
  if (rm >= standards[2]) return 2;
  if (rm >= standards[1]) return 1;
  if (rm >= standards[0]) return 0;
  return -1; // below beginner
}

function getTierLabel(idx) {
  return ["BEGINNER","INTERMEDIATE","ADVANCED","ELITE"][idx] ?? "SUB-BEG";
}
function getTierClass(idx) {
  return ["beg","int","adv","eli"][idx] ?? "beg";
}

function computeProfileScores() {
  // Gather best 1RMs across all workout days
  const best1RMs = {}; // standardName → best 1RM
  for (const day of WORKOUT_DAYS) {
    const exs = data[day] || {};
    for (const [exName, entries] of Object.entries(exs)) {
      const stdName = EX_ALIAS[exName] || (STRENGTH_STANDARDS[exName] ? exName : null);
      if (!stdName) continue;
      const rm = getBest1RM(sortedEntries(entries));
      if (rm && (!best1RMs[stdName] || rm > best1RMs[stdName])) {
        best1RMs[stdName] = rm;
      }
    }
  }

  // Score: 0–100 per lift. 25=beg, 50=int, 75=adv, 100=elite
  const scores = [];
  for (const [stdName, standards] of Object.entries(STRENGTH_STANDARDS)) {
    const rm = best1RMs[stdName];
    if (!rm) continue;
    const tierIdx = getTierIndex(rm, standards);
    // Interpolate within tier for smooth score
    let score;
    if (tierIdx < 0) {
      score = Math.round((rm / standards[0]) * 20);
    } else if (tierIdx === 3) {
      score = Math.min(100, 75 + Math.round(((rm - standards[3]) / standards[3]) * 25));
    } else {
      const lo = tierIdx === 0 ? 0 : standards[tierIdx - 1];
      const hi = standards[tierIdx];
      const within = (rm - lo) / (hi - lo);
      score = Math.round(tierIdx * 25 + within * 25);
    }
    scores.push({ name: stdName, rm, tierIdx, score, standards });
  }
  return scores;
}

function computeEnduranceScore() {
  // Endurance = avg reps across all logged sets (target: 12+ = good)
  let totalSets = 0, totalRepsAll = 0;
  for (const day of WORKOUT_DAYS) {
    for (const entries of Object.values(data[day] || {})) {
      for (const e of entries) {
        for (const r of e.sets) { totalRepsAll += r; totalSets++; }
      }
    }
  }
  if (totalSets === 0) return null;
  const avg = totalRepsAll / totalSets;
  // 6 reps → 30, 10 reps → 60, 15+ reps → 90+
  return Math.min(100, Math.round((avg / 15) * 90));
}

function computeConsistencyScore() {
  // Consistency = total sessions logged across all days (20+ = great)
  let total = 0;
  for (const day of WORKOUT_DAYS) {
    for (const entries of Object.values(data[day] || {})) {
      total += entries.length;
    }
  }
  return Math.min(100, Math.round((total / 30) * 100));
}

// State for the volume week window (0 = current 7 days, 1 = previous 7 days, etc.)
let volWeekOffset = 0;

// Parse MM/DD as days since a fixed epoch (Jan 1 of current year, handles year wrap)
function mmddToDayNum(mmdd) {
  if (!mmdd) return null;
  const [m, d] = mmdd.split("/").map(Number);
  if (!m || !d) return null;
  const now = new Date();
  let year = now.getFullYear();
  // Build date assuming current year
  let date = new Date(year, m - 1, d);
  // If date is in the future by more than 1 day, assume last year
  if (date - now > 86400000) date = new Date(year - 1, m - 1, d);
  return Math.floor(date.getTime() / 86400000);
}

function todayDayNum() {
  return Math.floor(Date.now() / 86400000);
}

function dayNumToLabel(dayNum) {
  const d = new Date(dayNum * 86400000);
  return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

// Compute sets per muscle group for a given 7-day window
function computeWeeklyVolume(offsetWeeks) {
  const todayNum = todayDayNum();
  const windowEnd = todayNum - offsetWeeks * 7;
  const windowStart = windowEnd - 6; // 7 days inclusive

  // muscle → { sets, exercises: Set }
  const totals = {};
  for (const muscle of Object.keys(MUSCLE_TARGETS)) {
    totals[muscle] = { sets: 0, exercises: new Set() };
  }

  for (const day of WORKOUT_DAYS) {
    const exs = data[day] || {};
    for (const [exName, entries] of Object.entries(exs)) {
      const muscles = EX_MUSCLE_MAP[exName];
      if (!muscles) continue;
      for (const entry of entries) {
        const dn = mmddToDayNum(entry.date);
        if (dn === null || dn < windowStart || dn > windowEnd) continue;
        const setsInEntry = entry.sets.length;
        for (const muscle of muscles) {
          if (!totals[muscle]) continue;
          // Compound lifts split credit: primary muscle gets full sets, secondary gets half
          const isPrimary = muscles[0] === muscle;
          totals[muscle].sets += isPrimary ? setsInEntry : Math.ceil(setsInEntry / 2);
          totals[muscle].exercises.add(exName);
        }
      }
    }
  }

  return { totals, windowStart, windowEnd };
}

// Look up which exercises in the log map to a given muscle
function getExercisesForMuscle(muscle) {
  const found = [];
  for (const day of WORKOUT_DAYS) {
    for (const exName of Object.keys(data[day] || {})) {
      const muscles = EX_MUSCLE_MAP[exName];
      if (muscles && muscles.includes(muscle) && !found.includes(exName)) {
        found.push(exName);
      }
    }
  }
  return found;
}

function renderProfile() {
  const scores = computeProfileScores();
  const endScore = computeEnduranceScore();
  const conScore = computeConsistencyScore();

  const hasData = scores.length > 0 || endScore !== null;

  if (!hasData) {
    return `<div class="prof-card">
      <div class="prof-title">FITNESS PROFILE</div>
      <div class="prof-setup">
        <div style="font-size:24px;margin-bottom:8px">📊</div>
        <div style="color:#666;margin-bottom:4px">No logged exercises yet.</div>
        <div style="color:#444">Log workouts to see your fitness profile.</div>
      </div>
    </div>`;
  }

  const avgStrengthScore = scores.length
    ? Math.round(scores.reduce((a,b) => a + b.score, 0) / scores.length)
    : 0;
  const enduranceScore = endScore ?? 0;
  const consistencyScore = conScore ?? 0;

  // Donut/pie chart segments: Strength, Endurance, Consistency
  // Using SVG arc segments
  const CX = 90, CY = 90, R = 68, INNER = 42;
  const segments = [
    { label: "STRENGTH",    value: avgStrengthScore,    color: "#5ab4f5" },
    { label: "ENDURANCE",   value: enduranceScore,      color: "#4ade80" },
    { label: "CONSISTENCY", value: consistencyScore,    color: "#f5a05a" },
  ];

  function polarToXY(cx, cy, r, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  function arcPath(cx, cy, r, inner, startDeg, endDeg, color) {
    const sweep = endDeg - startDeg;
    if (sweep <= 0) return "";
    const largeArc = sweep > 180 ? 1 : 0;
    const [ox, oy] = polarToXY(cx, cy, r, startDeg);
    const [ex2, ey2] = polarToXY(cx, cy, r, endDeg);
    const [ix, iy] = polarToXY(cx, cy, inner, endDeg);
    const [ix2, iy2] = polarToXY(cx, cy, inner, startDeg);
    return `<path d="M${ox.toFixed(2)},${oy.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${ex2.toFixed(2)},${ey2.toFixed(2)} L${ix.toFixed(2)},${iy.toFixed(2)} A${inner},${inner} 0 ${largeArc} 0 ${ix2.toFixed(2)},${iy2.toFixed(2)} Z" fill="${color}" opacity="0.9"/>`;
  }

  // Each segment gets 120° (3 equal thirds), filled proportionally to score
  const GAP = 6;
  const SLICE = 120 - GAP;
  let chartPaths = "";
  segments.forEach((seg, i) => {
    const start = i * 120 + GAP / 2;
    const filledDeg = (seg.value / 100) * SLICE;
    // background arc (empty)
    chartPaths += arcPath(CX, CY, R, INNER, start, start + SLICE, "#1e1e1e");
    // filled arc
    if (filledDeg > 0) {
      chartPaths += arcPath(CX, CY, R, INNER, start, start + filledDeg, seg.color);
    }
  });

  // Center text: overall score
  const overall = Math.round((avgStrengthScore + enduranceScore + consistencyScore) / 3);
  const overallTier = overall >= 75 ? "ELITE" : overall >= 50 ? "ADV" : overall >= 25 ? "INT" : "BEG";

  const donutSVG = `<svg viewBox="0 0 180 180" width="180" height="180">
    ${chartPaths}
    <text x="${CX}" y="${CY - 6}" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8" font-family="IBM Plex Mono, monospace">${overall}</text>
    <text x="${CX}" y="${CY + 10}" text-anchor="middle" font-size="9" fill="#555" font-family="IBM Plex Mono, monospace">OVERALL</text>
    <text x="${CX}" y="${CY + 24}" text-anchor="middle" font-size="8" fill="#888" font-family="IBM Plex Mono, monospace">${overallTier}</text>
  </svg>`;

  const legendHtml = segments.map(s =>
    `<div class="prof-leg-item"><div class="prof-leg-dot" style="background:${s.color}"></div>${s.label} ${s.value}%</div>`
  ).join("");

  // Per-lift breakdown
  const liftRows = scores.map(s => {
    const tierLabel = getTierLabel(s.tierIdx);
    const tierCls = getTierClass(s.tierIdx);
    return `<div class="prof-stat">
      <div class="prof-stat-lbl">${escH(s.name)}</div>
      <div class="prof-stat-val">${s.rm} lbs <span class="prof-tier ${tierCls}">${tierLabel}</span></div>
      <div class="prof-stat-sub">Est. 1RM · std ${s.standards[1]} / ${s.standards[2]} / ${s.standards[3]}</div>
    </div>`;
  }).join("");

  const noLiftMsg = scores.length === 0
    ? `<div style="color:#444;font-size:10px;text-align:center;padding:12px">Log compound lifts (Bench, Squat, Deadlift, etc.) to see strength tiers.</div>`
    : "";

  // ── Volume tracker ──────────────────────────────────────────
  const { totals, windowStart, windowEnd } = computeWeeklyVolume(volWeekOffset);
  const startLabel = dayNumToLabel(windowStart);
  const endLabel   = dayNumToLabel(windowEnd);
  const isCurrentWeek = volWeekOffset === 0;

  const volRows = Object.entries(MUSCLE_TARGETS).map(([muscle, target]) => {
    const actual = totals[muscle]?.sets ?? 0;
    const exNames = getExercisesForMuscle(muscle);
    const trackedInWindow = [...(totals[muscle]?.exercises ?? [])];

    const pct = Math.min(100, Math.round((actual / target.max) * 100));
    const isUnder = actual < target.min;
    const isOver  = actual > target.max;
    const isGood  = !isUnder && !isOver;

    const barColor = actual === 0 ? "#222"
      : isUnder ? "#f87171"
      : isOver  ? "#a78bfa"
      : "#c8f55a";

    const statusColor = actual === 0 ? "#444"
      : isUnder ? "#f87171"
      : isOver  ? "#a78bfa"
      : "#4ade80";

    const statusLabel = actual === 0 ? "NO DATA"
      : isUnder ? "UNDER"
      : isOver  ? "OVER"
      : "ON TRACK";

    const exListStr = exNames.length
      ? exNames.map(e => trackedInWindow.includes(e) ? `<span style="color:#8aaa2e">${escH(e)}</span>` : `<span style="color:#333">${escH(e)}</span>`).join(", ")
      : `<span style="color:#333">none mapped</span>`;

    return `<div class="vol-row">
      <div class="vol-left">
        <div class="vol-muscle">
          ${escH(muscle)}
        </div>
        <div class="vol-exlist">${exListStr}</div>
        <div class="vol-bar-track">
          <div class="vol-bar-fill" style="width:${pct}%;background:${barColor}"></div>
        </div>
      </div>
      <div class="vol-right">
        <div class="vol-count" style="color:${barColor}">${actual}</div>
        <div class="vol-target">${target.min}–${target.max} sets</div>
        <div class="vol-status" style="color:${statusColor}">${statusLabel}</div>
      </div>
    </div>`;
  }).join("");

  const onTrackCount  = Object.entries(MUSCLE_TARGETS).filter(([m, t]) => { const a = totals[m]?.sets ?? 0; return a >= t.min && a <= t.max; }).length;
  const underCount    = Object.entries(MUSCLE_TARGETS).filter(([m, t]) => { const a = totals[m]?.sets ?? 0; return a > 0 && a < t.min; }).length;
  const noDataCount   = Object.entries(MUSCLE_TARGETS).filter(([m])    => (totals[m]?.sets ?? 0) === 0).length;

  const volSummaryChips = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:3px;background:#1a2a1a;color:#4ade80">✓ ${onTrackCount} on track</span>
      ${underCount ? `<span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:3px;background:#2a1a1a;color:#f87171">↓ ${underCount} under</span>` : ""}
      ${noDataCount ? `<span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:3px;background:#1a1a1a;color:#555">· ${noDataCount} no data</span>` : ""}
    </div>`;

  const volWeekNav = `
    <div class="vol-week-nav">
      <button class="vol-week-btn" onclick="volWeekOffset++;render()">◀</button>
      <div class="vol-week-label">${isCurrentWeek ? "LAST 7 DAYS" : `${startLabel} – ${endLabel}`}</div>
      <button class="vol-week-btn" ${isCurrentWeek ? "disabled style=\"opacity:0.3\"" : ""} onclick="if(volWeekOffset>0){volWeekOffset--;render()}">▶</button>
    </div>`;

  const volLegend = `<div style="font-size:9px;color:#444;margin-bottom:10px;line-height:1.7">
    Highlighted exercise names = logged this window. Grey = in your split but no entries yet.
    Compounds (e.g. rows) credit primary muscle fully, secondary at 50%.
  </div>`;

  // 100/100 easter egg
  const isMaxed = overall >= 100;
  const easterEgg = isMaxed ? `
    <div class="prof-card" style="border-color:#f5c542;background:linear-gradient(135deg,#1a1500 0%,#161616 60%)">

function renderSearchResults() {
  const q = searchQuery.trim().toLowerCase();
  if (!q) return "";

  const hits = [];
  for (const day of WORKOUT_DAYS) {
    const exs = Object.keys(data[day] || {});
    for (const ex of exs) {
      if (ex.toLowerCase().includes(q)) {
        hits.push({ ex, day });
      }
    }
  }

  if (!hits.length) {
    return `<div class="search-empty">No exercises matching "<strong>${escH(searchQuery)}</strong>"</div>`;
  }

  return `<div class="search-results">
    ${hits.map(({ ex, day }) => {
      const entries = sortedEntries(data[day][ex] || []);
      const last = entries.length ? entries[entries.length - 1] : null;
      const delta = getDelta(entries);
      const prBadge = isPR(entries) ? ` <span style="color:#f5c542;font-size:11px">🏆</span>` : "";
      const da = last ? daysAgo(last.date) : null;
      const daClass = da === null ? "" : da <= 4 ? "fresh" : da >= 8 ? "stale" : "";
      const sub = last
        ? `${escH(last.date)} · <span class="w">${escH(fmtW(last.weight))}</span> · [${escH(fmtSets(last.sets))}]${delta ? `<br><span class="dw">${escH(delta.wv)}</span>` : ""}`
        : `<span style="color:#444">no entries yet</span>`;
      const exNote = getExNote(day, ex);
      const noteLine = exNote ? `<div style="font-size:10px;color:#8aaa2e;font-style:italic;margin-top:2px">${escH(exNote)}</div>` : "";
      return `<div class="ex-card">
        <div class="ex-header" style="cursor:default">
          <div style="flex:1;min-width:0">
            <div style="margin-bottom:3px">
              <span class="search-day-badge">${escH(day)}</span>
            </div>
            <div class="ex-name">${escH(ex)}${prBadge}</div>
            <div class="ex-sub">${sub}</div>

          <button class="manage-btn" onclick="openManage('${escQ(ex)}','${escQ(day)}')">⚙</button>
          <button class="log-btn" onclick="openLog('${escQ(ex)}','${escQ(day)}')">+ LOG</button>

// Exercise order is stored as an array in data.__order[tab]
function getExOrder(tab) {
  const keys = Object.keys(data[tab] || {}).filter(k => k !== "__order");
  const saved = data.__order && data.__order[tab];
  if (!saved) return keys;
  // Merge: saved order first, then any new exercises not yet in saved
  const ordered = saved.filter(k => keys.includes(k));
  const extra = keys.filter(k => !ordered.includes(k));
  return [...ordered, ...extra];
}

function saveExOrder(tab, order) {
  if (!data.__order) data.__order = {};
  data.__order[tab] = order;
  save();
}

// Long-press detection for mobile
let longPressTimer = null;
let longPressFired = false;

function onCardPointerDown(e, ex) {
  longPressFired = false;
  longPressTimer = setTimeout(() => {
    longPressFired = true;
    startDrag(ex, e.currentTarget.closest('.ex-card'));
  }, 400);
}

function onCardPointerUp() {
  clearTimeout(longPressTimer);
}

function onCardPointerMove(e) {
  // Cancel long press if finger moves significantly
  clearTimeout(longPressTimer);
}

// Active touch drag state
let touchDragEl = null;
let touchDragEx = null;
let touchDragClone = null;
let touchDragOffsetY = 0;

function startDrag(ex, cardEl) {
  touchDragEx = ex;
  touchDragEl = cardEl;
  cardEl.classList.add('dragging');
  // Haptic if available
  if (navigator.vibrate) navigator.vibrate(30);
}

function onCardTouchMove(e, ex) {
  if (!touchDragEx) return;
  e.preventDefault();
  const touch = e.touches[0];
  const allCards = [...document.querySelectorAll('.ex-card[data-ex]')];
  for (const card of allCards) {
    const rect = card.getBoundingClientRect();
    if (touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
      const overEx = card.getAttribute('data-ex');
      if (overEx && overEx !== touchDragEx) {
        allCards.forEach(c => c.classList.remove('drag-over'));
        card.classList.add('drag-over');
        dragOverEx = overEx;
      }
      break;
    }
  }
}

function onCardTouchEnd(e, ex) {
  if (!touchDragEx) return;
  document.querySelectorAll('.ex-card').forEach(c => {
    c.classList.remove('dragging', 'drag-over');
  });
  if (dragOverEx && dragOverEx !== touchDragEx) {
    reorderExercise(activeTab, touchDragEx, dragOverEx);
  }
  touchDragEx = null;
  touchDragEl = null;
  dragOverEx = null;
}

// Desktop drag events
function onDragStart(e, ex) {
  dragSrcEx = ex;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.ex-card').classList.add('dragging'), 0);
}

function onDragOver(e, ex) {
  e.preventDefault();
  if (ex === dragSrcEx) return;
  document.querySelectorAll('.ex-card').forEach(c => c.classList.remove('drag-over'));
  e.target.closest('.ex-card')?.classList.add('drag-over');
  dragOverEx = ex;
}

function onDragEnd(e) {
  document.querySelectorAll('.ex-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
  if (dragOverEx && dragSrcEx && dragOverEx !== dragSrcEx) {
    reorderExercise(activeTab, dragSrcEx, dragOverEx);
  }
  dragSrcEx = null;
  dragOverEx = null;
}

function reorderExercise(tab, srcEx, overEx) {
  const order = getExOrder(tab);
  const fromIdx = order.indexOf(srcEx);
  const toIdx = order.indexOf(overEx);
  if (fromIdx === -1 || toIdx === -1) return;
  order.splice(fromIdx, 1);
  order.splice(toIdx, 0, srcEx);
  saveExOrder(tab, order);
  render();
}

  const isOpen = expanded[activeTab+"|"+ex];

    dhtml = `<br><span class="dw">${escH(delta.wv)}</span>`;

  const sub = last
    ? `${escH(last.date)} · <span class="w">${escH(fmtW(last.weight))}</span> · [${escH(fmtSets(last.sets))}]${(last.bw || getBWForDate(last.date)) ? ` · BW ${(last.bw || getBWForDate(last.date))}` : ""}${dhtml}`
    : `<span style="color:#444">no entries yet</span>`;

  const exNote = getExNote(activeTab, ex);
  const noteLine = exNote ? `<div style="font-size:10px;color:#8aaa2e;font-style:italic;margin-top:2px">${escH(exNote)}</div>` : "";

          <span>${(e.bw || getBWForDate(e.date)) ? `${(e.bw || getBWForDate(e.date))} lbs BW` : "—"}</span>

    </div>` : '<div class="history"></div>';

  return `
    <div class="ex-card" data-ex="${escH(ex)}" draggable="true"
      ondragstart="onDragStart(event,'${escQ(ex)}')"
      ondragover="onDragOver(event,'${escQ(ex)}')"

      ontouchstart="onCardPointerDown(event,'${escQ(ex)}')"

      ontouchend="onCardTouchEnd(event,'${escQ(ex)}')"

      <div class="ex-header" onclick="if(!longPressFired)toggleCard('${escQ(ex)}')">
        <span class="drag-handle" title="Hold to reorder">⠿</span>
        <div style="flex:1;min-width:0">

        <button class="stats-btn" onclick="event.stopPropagation();openStats('${escQ(ex)}')">▲ STATS</button>
        <button class="manage-btn" onclick="event.stopPropagation();openManage('${escQ(ex)}')">⚙</button>
        <button class="log-btn" onclick="event.stopPropagation();openLog('${escQ(ex)}')">+ LOG</button>
        <span class="chevron">${isOpen?"▲":"▼"}</span>
      </div>
      ${hist}
    </div>`;
}

function renderBW() {
  const rawEntries = Array.isArray(data["BODY"]) ? data["BODY"] : [];
  const entries = sortedEntries(rawEntries);
  const latest = entries.length ? entries[entries.length-1] : null;
  const first  = entries.length > 1 ? entries[0] : null;
  const totalChg = (latest && first) ? (latest.weight - first.weight).toFixed(1) : null;
  const last7 = entries.slice(-7);
  const weekChg = last7.length >= 2 ? (last7[last7.length-1].weight - last7[0].weight).toFixed(1) : null;

  const statsHtml = `
    <div class="bw-stats">
      <div class="bw-stat">
        <div class="bw-stat-lbl">CURRENT</div>
        <div class="bw-stat-val">${latest?latest.weight:"—"}<span class="bw-unit">lbs</span></div>
      </div>
      ${totalChg!==null?`<div class="bw-stat">
        <div class="bw-stat-lbl">TOTAL</div>
        <div class="bw-stat-val ${parseFloat(totalChg)>0?"pos":"neg"}">${parseFloat(totalChg)>0?"+":""}${totalChg}<span class="bw-unit">lbs</span></div>
      </div>`:""}
      ${weekChg!==null?`<div class="bw-stat">
        <div class="bw-stat-lbl">LAST 7</div>
        <div class="bw-stat-val ${parseFloat(weekChg)>0?"pos":"neg"}">${parseFloat(weekChg)>0?"+":""}${weekChg}<span class="bw-unit">lbs</span></div>
      </div>`:""}
      ${latest&&latest.fat?`<div class="bw-stat">
        <div class="bw-stat-lbl">BODY FAT</div>
        <div class="bw-stat-val">${latest.fat}<span class="bw-unit">%</span></div>
      </div>`:""}
      ${latest&&latest.muscle?`<div class="bw-stat">
        <div class="bw-stat-lbl">MUSCLE</div>
        <div class="bw-stat-val">${latest.muscle}<span class="bw-unit">lbs</span></div>
      </div>`:""}
    </div>`;

  const chartEntries = entries.slice(-14);
  let chartHtml = "";
  if (bwHistOpen && chartEntries.length >= 2) {
    const ws = chartEntries.map(e=>e.weight);
    const mn = Math.min(...ws), mx = Math.max(...ws), rng = mx-mn||1;
    chartHtml = `<div class="bw-chart">
      ${chartEntries.map(e=>{
        const pct = ((e.weight-mn)/rng*70+15).toFixed(1);
        return `<div class="bar-row">
          <span class="bar-date">${escH(e.date)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="bar-val">${e.weight} lbs</span>
        </div>`;
      }).join("")}
    </div>`;
  }

  const histRows = bwHistOpen ? (entries.length ? entries.slice().reverse().map((e,i)=>{
    const prev = entries[entries.length-2-i];
    const diff = prev ? (e.weight-prev.weight).toFixed(1) : null;
    const cls = diff===null?"": parseFloat(diff)>0?"up":"dn";
    const ds = diff!==null ? `<span class="bw-delta ${cls}">${parseFloat(diff)>0?"+":""}${diff}</span>` : "";
    return `<div class="bw-erow ${i===0?"latest":""}">
      <span>${escH(e.date)}</span>
      <span>${e.weight} lbs ${ds}</span>
      ${e.fat?`<span>${e.fat}% fat</span>`:"<span></span>"}
      ${e.note?`<span class="hnote">${escH(e.note)}</span>`:""}
    </div>`;
  }).join("") : '<div class="empty">No weigh-ins yet.</div>') : "";

  return `
    <div class="bw-summary">${statsHtml}</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="bw-log-btn" style="margin-bottom:0;flex:2" onclick="openBW()">+ LOG WEIGH-IN</button>
      <button class="bw-log-btn" style="margin-bottom:0;flex:1;background:#1a1a1a;color:#666;border:1px solid #222" onclick="openManageBW()">⚙ MANAGE</button>
    </div>
    <div class="bw-card">
      <div class="bw-card-header" onclick="toggleBWHist()">
        <span class="bw-card-title">HISTORY ${entries.length?"("+entries.length+")":""}</span>
        <span class="chevron">${bwHistOpen?"▲":"▼"}</span>
      </div>
      ${chartHtml}
      ${histRows}
    </div>`;
}

function switchTab(t) { activeTab=t; searchQuery=""; render(); }
function toggleCard(ex) { const k=activeTab+"|"+ex; expanded[k]=!expanded[k]; render(); }

function openLog(ex, tab) { addingEx=ex; if(tab) activeTab=tab; render(); setTimeout(()=>{const el=document.getElementById("f-weight");if(el)el.focus();},50); }
function closeLog() { addingEx=null; render(); }
function submitLog() {
  const dv=(document.getElementById("f-date").value||today()).trim();
  const wr=document.getElementById("f-weight").value.trim();
  const sr=document.getElementById("f-sets").value.trim();
  const nv=document.getElementById("f-note").value.trim();
  if(!wr||!sr) return;
  const sets=sr.split(/[\s,/]+/).map(Number).filter(n=>!isNaN(n)&&n>0);
  if(!sets.length) return;
  const weight=isNaN(Number(wr))?wr:Number(wr);
  const writeDay = canonicalDay(addingEx);
  if(!data[writeDay][addingEx]) data[writeDay][addingEx]=[];
  const latestBW = Array.isArray(data["BODY"]) && data["BODY"].length
    ? data["BODY"][data["BODY"].length - 1].weight
    : null;

  data[writeDay][addingEx].push({
    date: dv,
    weight,
    sets,
    ...(latestBW ? { bw: latestBW } : {}),
    ...(nv ? { note: nv } : {})
  });
  save(); addingEx=null; render();
}

function openBW() { addingBW=true; render(); setTimeout(()=>{const el=document.getElementById("bw-weight");if(el)el.focus();},50); }
function closeBW() { addingBW=false; render(); }
function submitBW() {
  const dv=(document.getElementById("bw-date").value||today()).trim();
  const wv=parseFloat(document.getElementById("bw-weight").value);
  const fv=parseFloat(document.getElementById("bw-fat").value);
  const mv=parseFloat(document.getElementById("bw-muscle").value);
  const nv=document.getElementById("bw-note").value.trim();
  if(isNaN(wv)||wv<=0) return;
  if(!Array.isArray(data["BODY"])) data["BODY"]=[];
  data["BODY"].push({date:dv,weight:wv,...(!isNaN(fv)?{fat:fv}:{}),...(!isNaN(mv)?{muscle:mv}:{}),...(nv?{note:nv}:{})});
  save(); addingBW=false; bwHistOpen=true; render();
}

<script>
// Register service worker for offline support
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'strength-log-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys => Promise.all(
          keys.filter(k => k !== CACHE).map(k => caches.delete(k))
        ))
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => cached))
      );
    });
    // Cache the app shell on first visit
    self.addEventListener('install', e => {
      e.waitUntil(
        caches.open(CACHE).then(cache => cache.addAll([self.registration.scope]))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
